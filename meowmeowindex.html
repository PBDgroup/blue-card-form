               const statusObj = STATUS[e.status.toUpperCase()] || { label: e.status, color: '' };
               const approverName = e.approverId ? (userMap[e.approverId] || 'Unknown ID') : '-';
               
               if (e.items && Array.isArray(e.items)) { 
                   e.items.forEach(item => { 
                       if (filterCategory !== 'ALL' && item.category !== filterCategory) return;
                       flat.push({ 
                           id: e.id + '-' + item.id, runNumber: e.runNumber, date: item.date, description: item.description, 
                           category: item.category, amount: parseFloat(item.amount), status: statusObj.label, statusColor: statusObj.color, 
                           branch: branchName, requester: e.userName, approver: approverName, rejectReason: e.rejectReason, statusRaw: e.status
                       }); 
                   }); 
               } else { 
                   if (filterCategory !== 'ALL' && e.category !== filterCategory) return;
                   flat.push({ 
                       id: e.id, runNumber: e.runNumber, date: e.date ? new Date(e.date.seconds * 1000).toISOString().split('T')[0] : '-', 
                       description: e.description, category: e.category, amount: parseFloat(e.amount), status: statusObj.label, 
                       statusColor: statusObj.color, branch: branchName, requester: e.userName, approver: approverName, rejectReason: e.rejectReason, statusRaw: e.status
                   }); 
               }
            });
            return flat.sort((a, b) => new Date(b.date) - new Date(a.date));
          }, [expenses, branches, userMap, dateRange, filterCategory, filterBranch, filterUser]);

          const totalAmount = reportData.reduce((sum, item) => item.statusRaw !== 'rejected' ? sum + item.amount : sum, 0);
          const budgetValue = parseFloat(initialBudget) || 0;
          const remainingBudget = budgetValue - totalAmount;
          
          const exportToCSV = () => { 
              const branchSummary = {};
              reportData.forEach(item => {
                 if (item.statusRaw !== 'rejected') {
                    branchSummary[item.branch] = (branchSummary[item.branch] || 0) + item.amount;
                 }
              });

              const BOM = "\uFEFF";
              let csvContent = BOM;

              if (companyName) {
                  csvContent += `รายงานสรุปค่าใช้จ่าย: ${companyName}\n\n`;
              }

              csvContent += "สรุปภาพรวมงบประมาณ\n";
              csvContent += `ยอดเงินตั้งต้น (รับจากบริหาร),${budgetValue}\n`;
              csvContent += `รวมค่าใช้จ่ายทั้งหมด (ตามตัวกรอง),${totalAmount}\n`;
              csvContent += `ยอดคงเหลือสุทธิ,${remainingBudget}\n\n`;

              csvContent += "สรุปค่าใช้จ่ายแยกตามสาขา\n";
              csvContent += "สาขา,ยอดรวม (บาท)\n";
              Object.keys(branchSummary).forEach(branch => {
                  csvContent += `"${branch}",${branchSummary[branch]}\n`;
              });
              csvContent += "\n";

              csvContent += "รายละเอียดรายการเบิกจ่าย\n";
              const header = ['เลขที่ใบเบิก', 'วันที่', 'รายละเอียด', 'หมวดหมู่', 'จำนวนเงิน', 'สถานะ', 'ผู้อนุมัติ', 'สาขา', 'ผู้เบิก', 'เหตุผลที่ไม่อนุมัติ']; 
              const rows = reportData.map(item => [ item.runNumber || '-', item.date, `"${item.description.replace(/"/g, '""')}"`, EXPENSE_CATEGORIES.find(c => c.id === item.category)?.name || item.category, item.amount, item.status, item.approver, item.branch, item.requester, `"${(item.rejectReason || '').replace(/"/g, '""')}"` ]); 
              
              csvContent += [header.join(','), ...rows.map(r => r.join(','))].join('\n'); 

              const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' }); 
              const url = URL.createObjectURL(blob); 
              const link = document.createElement('a'); 
              link.href = url; 
              link.setAttribute('download', `expense_report_${new Date().toISOString().split('T')[0]}.csv`); 
              document.body.appendChild(link); 
              link.click(); 
              document.body.removeChild(link); 
          };
          
          return (
            <div className="space-y-4 flex flex-col h-[calc(100vh-160px)] md:h-[calc(100vh-120px)]">
               <div className="bg-white p-4 rounded-xl shadow-sm flex flex-col xl:flex-row justify-between items-start xl:items-center gap-4 shrink-0">
                  <div>
                    <h2 className="text-xl font-bold text-gray-800 flex items-center gap-2"><FileSpreadsheet className="text-green-600"/> รายงานสรุปค่าใช้จ่าย</h2>
                    <p className="text-gray-500 text-sm">ค้นหาและส่งออกรายงาน ({reportData.length} รายการ)</p>
                  </div>
                  <div className="flex items-center gap-4 md:gap-6 flex-wrap xl:flex-nowrap w-full xl:w-auto">
                    <div className="flex flex-col bg-blue-50 p-2 rounded-lg border border-blue-100 flex-1 md:flex-none">
                        <label className="text-[10px] font-bold text-blue-700 uppercase tracking-wider mb-1">งบประมาณรับมา (บาท)</label>
                        <input 
                            type="number" 
                            className="border-none rounded p-1 text-sm font-bold text-blue-900 focus:ring-2 focus:ring-blue-400 outline-none w-full md:w-32 bg-white" 
                            placeholder="ใส่ยอดเงิน..." 
                            value={initialBudget} 
                            onChange={e => setInitialBudget(e.target.value)} 
                        />
                    </div>
                    <div className="text-right hidden sm:block border-r pr-6">
                        <p className="text-xs text-gray-500 font-bold">รวมค่าใช้จ่าย</p>
                        <h3 className="text-xl font-black text-rose-500">฿{totalAmount.toLocaleString()}</h3>
                    </div>
                    <div className="text-right hidden sm:block">
                        <p className="text-xs text-gray-500 font-bold">ยอดคงเหลือ</p>
                        <h3 className={`text-xl font-black ${remainingBudget < 0 ? 'text-red-600' : 'text-emerald-600'}`}>
                            ฿{remainingBudget.toLocaleString()}
                        </h3>
                    </div>
                    <button onClick={exportToCSV} className="w-full md:w-auto bg-emerald-600 text-white px-5 py-3 rounded-xl font-black shadow-lg shadow-emerald-200 hover:bg-emerald-700 transition flex items-center justify-center gap-2 text-sm xl:ml-0"><FileSpreadsheet size={18} /> Export Excel (สรุปยอด)</button>
                  </div>
               </div>

               <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 grid grid-cols-2 md:flex md:flex-row gap-3 items-end md:items-center">
                  <div className="col-span-2 flex items-center gap-2 text-gray-700 font-bold md:mr-2"><Filter size={18}/> ตัวกรอง:</div>
                  <div className="col-span-2 flex items-center gap-2 bg-gray-50 p-1.5 rounded-lg border">
                     <span className="text-[10px] md:text-xs text-gray-500">วันที่:</span>
                     <input type="date" className="bg-white border rounded px-1 md:px-2 py-1 text-[10px] md:text-xs flex-1" value={dateRange.start} onChange={e => setDateRange({...dateRange, start: e.target.value})} />
                     <span className="text-[10px] md:text-xs text-gray-400">-</span>
                     <input type="date" className="bg-white border rounded px-1 md:px-2 py-1 text-[10px] md:text-xs flex-1" value={dateRange.end} onChange={e => setDateRange({...dateRange, end: e.target.value})} />
                  </div>
                  <div>
                     <select className="w-full border rounded-lg p-2 text-xs" value={filterCategory} onChange={e => setFilterCategory(e.target.value)}>
                         <option value="ALL">ทุกหมวดหมู่</option>
                         {EXPENSE_CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                     </select>
                  </div>
                  <div>
                     <select className="w-full border rounded-lg p-2 text-xs" value={filterBranch} onChange={e => setFilterBranch(e.target.value)}>
                         <option value="ALL">ทุกสาขา</option>
                         {branches.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
                         <option value="HEADQUARTER">สำนักงานใหญ่</option>
                     </select>
                  </div>
                  <div className="col-span-2 md:col-span-1">
                     <select className="w-full border rounded-lg p-2 text-xs" value={filterUser} onChange={e => setFilterUser(e.target.value)}>
                         <option value="ALL">ผู้เบิกทุกคน</option>
                         {users.map(u => <option key={u.id} value={u.id}>{u.name}</option>)}
                     </select>
                  </div>
                  <div className="col-span-2 md:hidden w-full text-right mt-2 border-t pt-2">
                     <span className="text-sm font-bold text-gray-600">รวม: ฿{totalAmount.toLocaleString()}</span>
                  </div>
               </div>

               <div className="bg-white rounded-xl shadow-sm overflow-hidden flex-1 flex flex-col">
                  <div className="overflow-y-auto overflow-x-auto flex-1 scrollbar-thin scrollbar-thumb-gray-200">
                     <table className="w-full text-left border-collapse relative min-w-[800px]">
                        <thead className="bg-gray-50 sticky top-0 z-10 shadow-sm">
                           <tr>
                              <th className="p-4 text-sm font-semibold text-gray-600">วันที่/เลขที่</th>
                              <th className="p-4 text-sm font-semibold text-gray-600">รายละเอียด</th>
                              <th className="p-4 text-sm font-semibold text-gray-600">หมวดหมู่</th>
                              <th className="p-4 text-sm font-semibold text-gray-600">ผู้เบิก/สาขา</th>
                              <th className="p-4 text-sm font-semibold text-gray-600 text-right">จำนวนเงิน</th>
                              <th className="p-4 text-sm font-semibold text-gray-600 text-center">สถานะ</th>
                              <th className="p-4 text-sm font-semibold text-gray-600 text-center">ผู้อนุมัติ</th>
                           </tr>
                        </thead>
                        <tbody className="divide-y">
                           {reportData.length === 0 ? (<tr><td colSpan="7" className="p-8 text-center text-gray-400">ไม่พบข้อมูลตามเงื่อนไข</td></tr>) : reportData.map((item, idx) => (
                              <tr key={idx} className="hover:bg-gray-50">
                                 <td className="p-4 text-sm text-gray-600 whitespace-nowrap"><div>{item.date}</div><div className="text-[10px] md:text-xs text-blue-500 font-bold">{item.runNumber}</div></td>
                                 <td className="p-4 text-sm font-medium text-gray-800"><div className="w-48 truncate">{item.description}</div></td>
                                 <td className="p-4 text-xs md:text-sm text-gray-500">{EXPENSE_CATEGORIES.find(c => c.id === item.category)?.name || item.category}</td>
                                 <td className="p-4 text-sm text-gray-600"><div className="font-medium">{item.requester}</div><div className="text-[10px] md:text-xs text-gray-400">{item.branch}</div></td>
                                 <td className="p-4 text-sm font-bold text-gray-800 text-right">฿{item.amount.toLocaleString()}</td>
                                 <td className="p-4 text-center"><span className={`inline-block px-2 py-0.5 rounded text-[10px] md:text-xs font-semibold ${item.statusColor}`}>{item.status}</span></td>
                                 <td className="p-4 text-xs md:text-sm text-center text-gray-600">{item.approver}</td>
                              </tr>
                           ))}
                        </tbody>
                     </table>
                  </div>
               </div>
            </div>
          );
        };

        const SettingsView = ({ user }) => {
          const { showAlert } = useContext(UIContext);
          const [settings, setSettings] = useState({ lineToken: '', scriptUrl: '', imgbbApiKey: '', companyName: '' });
          const [testLineId, setTestLineId] = useState('');
          const [loading, setLoading] = useState(false);
          const [isTesting, setIsTesting] = useState(false);
          const [logs, setLogs] = useState(["พร้อมเชื่อมต่อ..."]);

          useEffect(() => {
            const loadSettings = async () => {
              try {
                const docSnap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'config'));
                if (docSnap.exists()) {
                    setSettings({ 
                      lineToken: docSnap.data().lineToken || '', 
                      scriptUrl: docSnap.data().scriptUrl || '',
                      imgbbApiKey: docSnap.data().imgbbApiKey || '',
                      companyName: docSnap.data().companyName || ''
                    });
                }
              } catch (err) { console.error("Error loading settings:", err); }
            };
            const loadCurrentUser = async () => {
               const userDoc = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', user.uid));
               if (userDoc.exists() && userDoc.data().lineUserId) setTestLineId(userDoc.data().lineUserId);
            };
            loadSettings();
            loadCurrentUser();
          }, [user]);

          const handleSave = async () => {
            setLoading(true);
            try {
              await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'config'), {
                lineToken: settings.lineToken.trim(), 
                scriptUrl: settings.scriptUrl.trim(), 
                imgbbApiKey: settings.imgbbApiKey.trim(),
                companyName: settings.companyName.trim(),
                updatedAt: serverTimestamp()
              }, { merge: true });
              showAlert("บันทึกการตั้งค่าสำเร็จ!", 'success');
            } catch (err) { 
              console.error(err); 
              showAlert('เกิดข้อผิดพลาดในการบันทึก', 'error'); 
            }
            setLoading(false);
          };

          const handleTestSend = async () => {
            if (!settings.lineToken) return showAlert('กรุณาบันทึก Token ก่อนทดสอบ', 'error');
            if (!testLineId) return showAlert('กรุณาระบุ Line UserID ของผู้รับ', 'error');
            
            setIsTesting(true);
            const mockExpense = { description: 'ทดสอบระบบการเชื่อมต่อ', amount: 999.00, runNumber: 'TEST-00001', userName: 'System Admin', items: [{description: 'ทดสอบ', amount: 999}] };
            const flexMsg = createExpenseFlexMessage(mockExpense, 'pending');
            flexMsg.contents.body.contents[0].text = "🔔 ทดสอบการเชื่อมต่อระบบสำเร็จ!";
            
            const success = await sendLineMessage(testLineId, [flexMsg], settings.lineToken, settings.scriptUrl, setLogs, showAlert);
            
            if (success) showAlert('ส่งข้อความสำเร็จ! ตรวจสอบใน LINE', 'success');
            setIsTesting(false);
          };

          return (
            <div className="relative max-w-3xl mx-auto font-sans antialiased">
              <div className="bg-white p-6 md:p-10 rounded-[2rem] md:rounded-[3.5rem] shadow-sm border border-slate-100 space-y-8 animate-in slide-in-from-bottom-5">
                <div className="flex items-center gap-4 border-b border-slate-50 pb-6">
                   <div className="w-10 h-10 md:w-12 md:h-12 bg-indigo-100 rounded-xl flex items-center justify-center text-indigo-600">
                      <Settings size={20} className="md:w-6 md:h-6" />
                   </div>
                   <div>
                      <h2 className="font-black text-xl md:text-2xl text-slate-800">การตั้งค่าระบบ</h2>
                      <p className="text-[10px] md:text-xs font-black text-indigo-500 uppercase tracking-widest mt-1">ตั้งค่าทั่วไป และการเชื่อมต่อ</p>
                   </div>
                </div>

                <div className="space-y-4">
                  <label className="text-[10px] md:text-[11px] font-black text-slate-400 uppercase tracking-widest flex items-center gap-2"><Building2 size={14} /> ข้อมูลองค์กร</label>
                  <div className="space-y-2">
                    <label className="text-xs font-black text-slate-500 ml-1">ชื่อบริษัท / องค์กร (แสดงในหน้า Login และ Report)</label>
                    <input className="w-full p-4 md:p-5 rounded-2xl bg-slate-50 border-none font-medium text-xs md:text-sm focus:ring-2 focus:ring-indigo-500 transition-all shadow-inner text-slate-700" value={settings.companyName} onChange={e => setSettings({...settings, companyName: e.target.value})} placeholder="เช่น บริษัท แมวเหมียว จำกัด" />
                  </div>
                </div>

                <div className="space-y-4 pt-2 border-t border-slate-50">
                  <label className="text-[10px] md:text-[11px] font-black text-slate-400 uppercase tracking-widest flex items-center gap-2"><Terminal size={14} /> Connection Logs (ระบบแจ้งเตือน)</label>
                  <div className="bg-slate-900 rounded-[1.5rem] p-5 font-mono text-[10px] md:text-[11px] text-indigo-300 min-h-[120px] md:min-h-[160px] flex flex-col justify-end border-4 border-slate-800 shadow-inner overflow-hidden">
                    {logs.map((log, i) => <div key={i} className={`mb-1.5 ${log.includes('✅') ? 'text-emerald-400 font-bold' : log.includes('⚠️') || log.includes('❌') ? 'text-rose-400' : ''}`}>{log}</div>)}
                  </div>
                </div>
                <div className="space-y-6">
                  <div className="space-y-4">
                    <div className="space-y-2">
                      <label className="text-xs font-black text-slate-500 ml-1">Google Script URL (แนะนำ)</label>
                      <input className="w-full p-4 md:p-5 rounded-2xl bg-slate-50 border-none font-mono text-xs md:text-sm focus:ring-2 focus:ring-indigo-500 transition-all shadow-inner text-slate-700" value={settings.scriptUrl} onChange={e => setSettings({...settings, scriptUrl: e.target.value})} placeholder="https://script.google.com/macros/s/.../exec" />
                    </div>
                    <div className="space-y-2">
                      <label className="text-xs font-black text-slate-500 ml-1">LINE Channel Token</label>
                      <textarea rows="3" className="w-full p-4 md:p-5 rounded-2xl bg-slate-50 border-none font-mono text-xs md:text-sm focus:ring-2 focus:ring-indigo-500 transition-all shadow-inner text-slate-700" value={settings.lineToken} onChange={e => setSettings({...settings, lineToken: e.target.value})} placeholder="Channel Access Token (Long-lived)" />
                    </div>
                    <div className="space-y-2">
                      <label className="text-[10px] md:text-xs font-black text-slate-500 ml-1 flex flex-wrap items-center gap-2">Imgbb API Key (ตัวช่วยแปลงรูปเข้า LINE) <a href="https://api.imgbb.com/" target="_blank" rel="noreferrer" className="text-indigo-500 underline">ขอรับฟรีที่นี่</a></label>
                      <input className="w-full p-4 md:p-5 rounded-2xl bg-slate-50 border-none font-mono text-xs md:text-sm focus:ring-2 focus:ring-indigo-500 transition-all shadow-inner text-slate-700" value={settings.imgbbApiKey} onChange={e => setSettings({...settings, imgbbApiKey: e.target.value})} placeholder="ใส่ Imgbb API Key..." />
                    </div>
                    <div className="space-y-2">
                      <label className="text-xs font-black text-slate-500 ml-1">ทดสอบส่งไปยัง Line User ID</label>
                      <input className="w-full p-4 md:p-5 rounded-2xl bg-slate-50 border-none font-mono text-xs md:text-sm focus:ring-2 focus:ring-indigo-500 transition-all shadow-inner text-slate-700" value={testLineId} onChange={e => setTestLineId(e.target.value)} placeholder="Uxxxxxxxxxxxxxxxxxxxx..." />
                    </div>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-4">
                    <button onClick={handleSave} disabled={loading} className="bg-slate-900 text-white py-4 rounded-2xl font-black shadow-xl active:scale-95 transition-all flex items-center justify-center gap-2">
                       {loading ? 'กำลังบันทึก...' : 'บันทึกข้อมูล'}
                    </button>
                    <button disabled={isTesting || !settings.lineToken} onClick={handleTestSend} className="border-2 border-indigo-600 text-indigo-600 py-4 rounded-2xl font-black flex items-center justify-center gap-2 active:scale-95 transition-all disabled:opacity-30">
                      {isTesting ? <RefreshCw className="animate-spin" size={20} /> : <Wifi size={20} />} ทดสอบส่ง
                    </button>
                  </div>
                </div>
              </div>
            </div>
          );
        };

        const EmployeeManager = ({ branches }) => {
          const { showAlert, showConfirm } = useContext(UIContext);
          const [employees, setEmployees] = useState([]);
          const [editingId, setEditingId] = useState(null);
          const [editForm, setEditForm] = useState({ name: '', role: '', branchId: '', pin: '', lineUserId: '' });
          const [newUser, setNewUser] = useState({ name: '', role: ROLES.EMPLOYEE, branchId: '', pin: '0000', lineUserId: '' });
          const [isAdding, setIsAdding] = useState(false);

          useEffect(() => {
            const unsub = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'users'), (snapshot) => {
               setEmployees(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
            });
            return () => unsub();
          }, []);

          const handleCreateUser = async (e) => {
            e.preventDefault();
            if (!newUser.name) return showAlert('กรุณาระบุชื่อ', 'error');
            if (newUser.role !== ROLES.ADMIN && !newUser.branchId) return showAlert('กรุณาเลือกสาขา', 'error');

            try {
              const newRef = doc(collection(db, 'artifacts', appId, 'public', 'data', 'users'));
              await setDoc(newRef, { ...newUser, createdAt: serverTimestamp() });
              showAlert('เพิ่มพนักงานเรียบร้อยแล้ว', 'success');
              setIsAdding(false);
              setNewUser({ name: '', role: ROLES.EMPLOYEE, branchId: '', pin: '0000', lineUserId: '' });
            } catch (err) { console.error(err); showAlert('เกิดข้อผิดพลาดในการเพิ่มพนักงาน', 'error'); }
          };

          const handleEdit = (emp) => {
            setEditingId(emp.id);
            setEditForm({ name: emp.name, role: emp.role, branchId: emp.branchId || '', pin: emp.pin || '', lineUserId: emp.lineUserId || '' });
          };

          const handleSave = async () => {
            if (!editForm.name) return showAlert('กรุณาระบุชื่อ', 'error');
            try {
              await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', editingId), {
                name: editForm.name, role: editForm.role, branchId: editForm.branchId, pin: editForm.pin, lineUserId: editForm.lineUserId
              });
              setEditingId(null);
              showAlert('บันทึกข้อมูลเรียบร้อยแล้ว', 'success');
            } catch(err) { console.error(err); showAlert('เกิดข้อผิดพลาดในการบันทึก', 'error'); }
          };

          const handleDelete = (id) => {
            showConfirm('ยืนยันการลบพนักงานคนนี้?', async () => {
                try { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', id)); showAlert('ลบข้อมูลสำเร็จ', 'success'); } catch(err) { console.error(err); }
            });
          };

          return (
            <div className="max-w-6xl mx-auto space-y-6">
               <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-6 rounded-xl shadow-sm">
                  <div><h2 className="text-xl font-bold flex items-center gap-2 text-gray-800"><Users className="text-blue-600" /> จัดการพนักงาน</h2><p className="text-gray-500 text-sm mt-1">รายชื่อพนักงานทั้งหมด</p></div>
                  <button onClick={() => setIsAdding(!isAdding)} className="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 hover:bg-blue-700 w-full sm:w-auto justify-center">{isAdding ? <X size={16}/> : <UserPlus size={16}/>}{isAdding ? 'ปิดฟอร์ม' : 'เพิ่มพนักงาน'}</button>
               </div>
               {isAdding && (
                 <div className="bg-blue-50 p-6 rounded-xl border border-blue-100 animate-in fade-in slide-in-from-top-4">
                    <h3 className="font-bold text-blue-800 mb-4 flex items-center gap-2"><UserPlus size={18}/> ลงทะเบียนพนักงานใหม่</h3>
                    <form onSubmit={handleCreateUser} className="grid grid-cols-1 md:grid-cols-2 gap-4 items-end">
                       <div><label className="text-xs font-semibold text-blue-700 mb-1 block">ชื่อ-นามสกุล</label><input className="w-full p-2 border rounded" value={newUser.name} onChange={e => setNewUser({...newUser, name: e.target.value})} placeholder="ชื่อพนักงาน" /></div>
                       <div><label className="text-xs font-semibold text-blue-700 mb-1 block">ตำแหน่ง</label><select className="w-full p-2 border rounded" value={newUser.role} onChange={e => setNewUser({...newUser, role: e.target.value})}><option value={ROLES.EMPLOYEE}>พนักงาน</option><option value={ROLES.MANAGER}>หัวหน้างาน</option><option value={ROLES.ADMIN}>ผู้ดูแลระบบ</option></select></div>
                       <div><label className="text-xs font-semibold text-blue-700 mb-1 block">สาขา</label><select className="w-full p-2 border rounded" value={newUser.branchId} onChange={e => setNewUser({...newUser, branchId: e.target.value})}><option value="">- เลือกสาขา -</option>{branches.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}<option value="HEADQUARTER">สำนักงานใหญ่</option></select></div>
                       <div><label className="text-xs font-semibold text-blue-700 mb-1 block">PIN เริ่มต้น</label><input className="w-full p-2 border rounded text-center" value={newUser.pin} maxLength={4} onChange={e => setNewUser({...newUser, pin: e.target.value})} /></div>
                       <div className="md:col-span-2"><label className="text-xs font-semibold text-green-700 mb-1 block">Line UserID (สำหรับแจ้งเตือน)</label><input className="w-full p-2 border rounded border-green-200 bg-green-50 font-mono text-sm" value={newUser.lineUserId} onChange={e => setNewUser({...newUser, lineUserId: e.target.value})} placeholder="Uxxxxxxxxxxxxxxxxxxxx" /></div>
                       <div className="md:col-span-2"><button type="submit" className="w-full bg-blue-600 text-white p-3 rounded-lg font-bold hover:bg-blue-700">บันทึกพนักงานใหม่</button></div>
                    </form>
                 </div>
               )}
               <div className="bg-white rounded-xl shadow-sm overflow-hidden mt-6">
                  <div className="overflow-x-auto">
                      <table className="w-full text-left min-w-[700px]">
                         <thead className="bg-gray-50 border-b"><tr><th className="p-4 text-sm font-semibold text-gray-600">ชื่อ-นามสกุล</th><th className="p-4 text-sm font-semibold text-gray-600">Line UserID</th><th className="p-4 text-sm font-semibold text-gray-600">ตำแหน่ง/สาขา</th><th className="p-4 text-sm font-semibold text-gray-600 text-right">จัดการ</th></tr></thead>
                         <tbody className="divide-y">
                           {employees.length === 0 ? (<tr><td colSpan="4" className="p-8 text-center text-gray-400">ยังไม่มีข้อมูลพนักงาน</td></tr>) : employees.map(emp => (
                             <tr key={emp.id} className="hover:bg-gray-50">
                                {editingId === emp.id ? (
                                  <>
                                    <td className="p-4"><input className="border p-2 rounded w-full text-sm" value={editForm.name} onChange={e => setEditForm({...editForm, name: e.target.value})} /></td>
                                    <td className="p-4"><input className="border p-2 rounded w-full text-sm font-mono" value={editForm.lineUserId} onChange={e => setEditForm({...editForm, lineUserId: e.target.value})} placeholder="Line ID" /></td>
                                    <td className="p-4">
                                       <div className="flex gap-2 flex-col">
                                         <select className="border p-2 rounded w-full text-sm" value={editForm.role} onChange={e => setEditForm({...editForm, role: e.target.value})}><option value={ROLES.EMPLOYEE}>พนักงาน</option><option value={ROLES.MANAGER}>หัวหน้างาน</option><option value={ROLES.ADMIN}>ผู้ดูแลระบบ</option></select>
                                         <select className="border p-2 rounded w-full text-sm" value={editForm.branchId} onChange={e => setEditForm({...editForm, branchId: e.target.value})}><option value="">- เลือกสาขา -</option>{branches.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}<option value="HEADQUARTER">สำนักงานใหญ่</option></select>
                                       </div>
                                    </td>
                                    <td className="p-4 text-right flex justify-end gap-2"><button onClick={handleSave} className="text-green-600 bg-green-50 px-3 py-1.5 rounded hover:bg-green-100 text-sm font-bold">บันทึก</button><button onClick={() => setEditingId(null)} className="text-gray-500 bg-gray-50 px-3 py-1.5 rounded hover:bg-gray-100 text-sm">ยกเลิก</button></td>
                                  </>
                                ) : (
                                  <>
                                    <td className="p-4"><div className="font-medium text-gray-800">{emp.name}</div><div className="text-xs text-gray-400">PIN: {emp.pin ? '••••' : '-'}</div></td>
                                    <td className="p-4 text-[10px] md:text-sm text-gray-600 font-mono">{emp.lineUserId || <span className="text-gray-300">-</span>}</td>
                                    <td className="p-4 text-sm text-gray-600"><span className={`text-[10px] md:text-xs px-2 py-0.5 md:py-1 rounded-full capitalize ${emp.role === ROLES.ADMIN ? 'bg-purple-100 text-purple-700' : emp.role === ROLES.MANAGER ? 'bg-orange-100 text-orange-700' : 'bg-blue-100 text-blue-700'}`}>{emp.role}</span><span className="block mt-1 text-[10px] md:text-xs">{emp.branchId === 'HEADQUARTER' ? 'สำนักงานใหญ่' : branches.find(b => b.id === emp.branchId)?.name || '-'}</span></td>
                                    <td className="p-4 text-right"><button onClick={() => handleEdit(emp)} className="text-blue-600 hover:bg-blue-50 p-2 rounded-lg" title="แก้ไข"><Edit size={16} /></button><button onClick={() => handleDelete(emp.id)} className="text-red-400 hover:bg-red-50 p-2 rounded-lg" title="ลบ"><Trash2 size={16} /></button></td>
                                  </>
                                )}
                             </tr>
                           ))}
                         </tbody>
                      </table>
                  </div>
               </div>
            </div>
          );
        };

        const BranchManager = ({ branches }) => {
          const { showAlert, showConfirm } = useContext(UIContext);
          const [newBranch, setNewBranch] = useState({ name: '', location: '' });

          const handleAdd = async (e) => { 
              e.preventDefault(); 
              if (!newBranch.name) return showAlert("กรุณาระบุชื่อสาขา"); 
              try { await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'branches'), newBranch); setNewBranch({ name: '', location: '' }); showAlert("เพิ่มสาขาสำเร็จ", "success"); } 
              catch(err) { console.error(err); showAlert("ข้อผิดพลาดในการเพิ่มสาขา"); } 
          };
          
          const handleDelete = (id) => { 
              showConfirm('ยืนยันการลบสาขานี้?', async () => {
                  try { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'branches', id)); showAlert("ลบสาขาสำเร็จ", "success"); } 
                  catch(err) { console.error(err); } 
              });
          };

          return (
            <div className="max-w-4xl mx-auto space-y-6">
              <div className="bg-white p-6 rounded-xl shadow-sm"><h3 className="text-lg font-bold mb-4 flex items-center gap-2"><Building2 className="text-blue-600"/> เพิ่มสาขาใหม่</h3><form onSubmit={handleAdd} className="flex flex-col md:flex-row gap-4 md:items-end"><div className="flex-1"><label className="text-sm text-gray-600 block mb-1">ชื่อสาขา</label><input value={newBranch.name} onChange={e => setNewBranch({...newBranch, name: e.target.value})} className="w-full border p-2 rounded-lg" placeholder="เช่น สาขาเชียงใหม่" /></div><div className="flex-1"><label className="text-sm text-gray-600 block mb-1">ที่ตั้ง/รหัส</label><input value={newBranch.location} onChange={e => setNewBranch({...newBranch, location: e.target.value})} className="w-full border p-2 rounded-lg" placeholder="เช่น CNX-001" /></div><button type="submit" className="bg-blue-600 text-white px-6 py-2.5 rounded-lg hover:bg-blue-700 font-medium">เพิ่มสาขา</button></form></div>
              <div className="bg-white rounded-xl shadow-sm overflow-hidden mt-6">
                <h3 className="text-lg font-bold p-5 border-b">รายชื่อสาขา ({branches.length})</h3>
                <div className="overflow-x-auto">
                    <table className="w-full text-left min-w-[500px]">
                        <thead className="bg-gray-50"><tr><th className="p-4 text-sm font-semibold">ชื่อสาขา</th><th className="p-4 text-sm font-semibold">ที่ตั้ง</th><th className="p-4 text-sm font-semibold text-right">จัดการ</th></tr></thead>
                        <tbody className="divide-y">{branches.map(b => (<tr key={b.id} className="hover:bg-gray-50"><td className="p-4 font-medium">{b.name}</td><td className="p-4 text-gray-500">{b.location}</td><td className="p-4 text-right"><button onClick={() => handleDelete(b.id)} className="text-red-500 hover:text-red-700 text-sm bg-red-50 px-3 py-1.5 rounded-lg">ลบ</button></td></tr>))}</tbody>
                    </table>
                </div>
              </div>
            </div>
          );
        };

        // --- MainApp Container ---
        const MainApp = ({ user, onLogout }) => {
          const [view, setView] = useState('dashboard');
          const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
          const [expenses, setExpenses] = useState([]);
          const [branches, setBranches] = useState([]);
          const [companyName, setCompanyName] = useState('');
          
          useEffect(() => {
            const unsubscribeExpenses = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'expenses'), (snapshot) => {
              let data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              if (user.role === ROLES.EMPLOYEE) data = data.filter(item => item.createdBy === user.uid);
              data.sort((a, b) => (b.date?.seconds || 0) - (a.date?.seconds || 0));
              setExpenses(data);
            });
            const unsubscribeBranches = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'branches'), (snapshot) => {
              setBranches(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
            });
            const unsubscribeSettings = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'config'), (snap) => {
              if(snap.exists() && snap.data().companyName) setCompanyName(snap.data().companyName);
            });
            return () => { unsubscribeExpenses(); unsubscribeBranches(); unsubscribeSettings(); };
          }, [user]);

          const getBranchName = (id) => {
              if (id === 'HEADQUARTER') return 'สำนักงานใหญ่';
              return branches.find(b => b.id === id)?.name || 'Unknown';
          };

          const menuItems = [
            { id: 'dashboard', label: 'ภาพรวม', icon: <LayoutDashboard size={20} />, roles: ['all'] },
            { id: 'request', label: 'ขอเบิกค่าใช้จ่าย', icon: <PlusCircle size={20} />, roles: [ROLES.EMPLOYEE, ROLES.MANAGER, ROLES.ADMIN] },
            { id: 'history', label: 'ประวัติรายการ', icon: <History size={20} />, roles: [ROLES.EMPLOYEE, ROLES.MANAGER, ROLES.ADMIN] },
            { id: 'approvals', label: 'รออนุมัติ/โอน', icon: <ClipboardCheck size={20} />, roles: [ROLES.MANAGER] },
            { id: 'reports', label: 'รายงานสรุป', icon: <FileSpreadsheet size={20} />, roles: [ROLES.ADMIN, ROLES.MANAGER] },
            { id: 'users', label: 'จัดการพนักงาน', icon: <Users size={20} />, roles: [ROLES.ADMIN] },
            { id: 'branches', label: 'จัดการสาขา', icon: <Building2 size={20} />, roles: [ROLES.ADMIN] },
            { id: 'settings', label: 'ตั้งค่าระบบ', icon: <Settings size={20} />, roles: [ROLES.ADMIN] },
          ];

          const filteredMenu = menuItems.filter(item => item.roles.includes('all') || item.roles.includes(user.role));

          const renderContent = () => {
            switch (view) {
              case 'dashboard': return <DashboardView expenses={expenses} user={user} branches={branches} />;
              case 'request': return <RequestForm user={user} setView={setView} branches={branches} expenses={expenses} />;
              case 'history': return <HistoryView expenses={expenses} getBranchName={getBranchName} user={user} />;
              case 'approvals': return <ApprovalQueue expenses={expenses} user={user} />;
              case 'reports': return <ReportView expenses={expenses} branches={branches} companyName={companyName} />;
              case 'branches': return <BranchManager branches={branches} />;
              case 'users': return <EmployeeManager branches={branches} />;
              case 'settings': return <SettingsView user={user} />;
              default: return <DashboardView expenses={expenses} user={user} branches={branches} />;
            }
          };

          return (
            <div className="flex h-screen paw-bg font-sans overflow-hidden">
              {/* Desktop Sidebar */}
              <aside className="hidden md:flex flex-col w-64 bg-white/90 backdrop-blur-md shadow-xl border-r border-pink-200 z-10">
                <div className="p-6 border-b border-pink-100 flex items-center gap-3">
                  <div className="bg-pink-100 p-2 rounded-xl text-pink-600 shadow-inner"><Cat size={28} /></div>
                  <div className="flex flex-col">
                      <span className="font-extrabold text-xl text-transparent bg-clip-text bg-gradient-to-r from-pink-600 to-amber-600 leading-tight">MeowEx</span>
                      {companyName && <span className="text-[10px] font-bold text-gray-400 leading-tight w-36 truncate">{companyName}</span>}
                  </div>
                </div>
                <div className="p-4 border-b border-pink-100 bg-pink-50/50">
                   <div className="flex items-center gap-3">
                     <div className="bg-white p-2 rounded-full border-2 border-pink-200 shadow-sm"><Cat className="text-pink-500" size={24}/></div>
                     <div>
                       <p className="font-bold text-sm text-pink-900">{user.name}</p>
                       <p className="text-xs text-pink-600/70 capitalize font-medium">{user.role}</p>
                       {user.branchId && <p className="text-xs text-amber-600 font-bold truncate w-32 flex items-center gap-1"><PawPrint size={10}/> {getBranchName(user.branchId)}</p>}
                     </div>
                   </div>
                </div>
                <nav className="flex-1 p-4 space-y-2 overflow-y-auto scrollbar-thin scrollbar-thumb-pink-200">
                  {filteredMenu.map(item => (
                    <button key={item.id} onClick={() => setView(item.id)} className={`w-full flex items-center space-x-3 px-4 py-3.5 rounded-2xl transition-all font-semibold ${view === item.id ? 'bg-gradient-to-r from-pink-500 to-pink-400 text-white shadow-md shadow-pink-500/30 scale-[1.02]' : 'text-slate-700 hover:bg-pink-50 hover:text-pink-700'}`}>
                      {item.icon}<span>{item.label}</span>
                    </button>
                  ))}
                </nav>
                <div className="p-4 border-t border-pink-100 bg-white">
                  <button onClick={onLogout} className="w-full flex items-center justify-center space-x-2 px-4 py-3 text-red-500 hover:bg-red-50 hover:text-red-600 rounded-2xl transition font-bold border border-transparent hover:border-red-100">
                    <LogOut size={18} /><span>ออกจากระบบ</span>
                  </button>
                </div>
              </aside>
              
              {/* Mobile Top Header */}
              <div className="md:hidden fixed top-0 w-full bg-white/95 backdrop-blur-md shadow-sm z-30 flex items-center justify-between p-3 px-5 border-b border-pink-100">
                <div className="flex items-center gap-2">
                  <div className="bg-pink-100 p-1.5 rounded-lg text-pink-600"><Cat size={20} /></div>
                  <div className="flex flex-col">
                     <span className="font-extrabold text-lg text-transparent bg-clip-text bg-gradient-to-r from-pink-600 to-amber-600 leading-tight">MeowExpense</span>
                     {companyName && <span className="text-[10px] font-bold text-gray-400 leading-tight truncate max-w-[120px]">{companyName}</span>}
                  </div>
                </div>
                <div className="flex items-center gap-3">
                   <div className="text-right hidden sm:block">
                      <p className="text-xs font-bold text-pink-900 leading-tight">{user.name}</p>
                      <p className="text-[10px] text-pink-500 capitalize leading-tight">{user.role}</p>
                   </div>
                   <div className="w-9 h-9 bg-pink-100 border-2 border-pink-200 rounded-full flex items-center justify-center text-pink-600 font-bold text-sm shadow-sm">{user.name.charAt(0)}</div>
                </div>
              </div>

              {/* Main Content Area */}
              <main className="flex-1 overflow-auto p-4 pt-20 pb-24 md:p-8 md:pt-8 md:pb-8 relative w-full scrollbar-thin scrollbar-thumb-pink-200">
                <div className="max-w-6xl mx-auto relative z-10 animate-in fade-in">{renderContent()}</div>
              </main>

              {/* Mobile Bottom Navigation */}
              <div className="md:hidden fixed bottom-0 w-full bg-white border-t border-pink-100 flex justify-around items-end pb-safe pt-2 px-2 z-40 mobile-bottom-nav">
                 <button onClick={() => {setView('dashboard'); setIsMobileMenuOpen(false);}} className={`flex flex-col items-center justify-center p-2 w-[20%] transition-all ${view==='dashboard'?'text-pink-600 -translate-y-1':'text-gray-400 hover:text-pink-400'}`}>
                    <div className={`p-1.5 rounded-xl ${view==='dashboard'?'bg-pink-50':''}`}><Home size={22} /></div>
                    <span className={`text-[10px] mt-0.5 font-medium ${view==='dashboard'?'font-bold':''}`}>ภาพรวม</span>
                 </button>
                 <button onClick={() => {setView('request'); setIsMobileMenuOpen(false);}} className={`flex flex-col items-center justify-center p-2 w-[20%] transition-all ${view==='request'?'text-pink-600 -translate-y-1':'text-gray-400 hover:text-pink-400'}`}>
                    <div className={`p-1.5 rounded-xl ${view==='request'?'bg-pink-50':''}`}><PlusCircle size={22}/></div>
                    <span className={`text-[10px] mt-0.5 font-medium ${view==='request'?'font-bold':''}`}>เบิกเงิน</span>
                 </button>
                 
                 {filteredMenu.some(m => m.id === 'approvals') && (
                    <button onClick={() => {setView('approvals'); setIsMobileMenuOpen(false);}} className={`flex flex-col items-center justify-center p-2 w-[20%] transition-all ${view==='approvals'?'text-blue-600 -translate-y-1':'text-gray-400 hover:text-blue-400'}`}>
                        <div className={`p-1.5 rounded-xl ${view==='approvals'?'bg-blue-50':''}`}><ClipboardCheck size={22}/></div>
                        <span className={`text-[10px] mt-0.5 font-medium ${view==='approvals'?'font-bold':''}`}>อนุมัติ</span>
                    </button>
                 )}

                 <button onClick={() => {setView('history'); setIsMobileMenuOpen(false);}} className={`flex flex-col items-center justify-center p-2 w-[20%] transition-all ${view==='history'?'text-pink-600 -translate-y-1':'text-gray-400 hover:text-pink-400'}`}>
                    <div className={`p-1.5 rounded-xl ${view==='history'?'bg-pink-50':''}`}><History size={22}/></div>
                    <span className={`text-[10px] mt-0.5 font-medium ${view==='history'?'font-bold':''}`}>ประวัติ</span>
                 </button>
                 <button onClick={() => setIsMobileMenuOpen(true)} className={`flex flex-col items-center justify-center p-2 w-[20%] transition-all ${isMobileMenuOpen?'text-pink-600 -translate-y-1':'text-gray-400 hover:text-pink-400'}`}>
                    <div className={`p-1.5 rounded-xl ${isMobileMenuOpen?'bg-pink-50':''}`}><Menu size={22}/></div>
                    <span className={`text-[10px] mt-0.5 font-medium ${isMobileMenuOpen?'font-bold':''}`}>เมนู</span>
                 </button>
              </div>

              {/* Mobile Side Menu Overlay */}
              {isMobileMenuOpen && (
                <div className="fixed inset-0 bg-pink-900/40 backdrop-blur-sm z-50 md:hidden flex justify-end" onClick={() => setIsMobileMenuOpen(false)}>
                  <div className="h-full w-72 bg-white shadow-2xl p-0 flex flex-col animate-in slide-in-from-right-8" onClick={e => e.stopPropagation()}>
                    <div className="bg-pink-50 p-6 flex flex-col border-b border-pink-100 relative">
                       <button onClick={() => setIsMobileMenuOpen(false)} className="absolute top-4 right-4 text-pink-400 bg-white p-1.5 rounded-full shadow-sm"><X size={18}/></button>
                       <div className="bg-white w-14 h-14 rounded-full flex items-center justify-center text-pink-600 shadow-sm mb-3 border-2 border-pink-200">
                          <Cat size={28} />
                       </div>
                       {companyName && <p className="text-[10px] font-bold text-pink-500 uppercase tracking-widest mb-1">{companyName}</p>}
                       <p className="font-bold text-pink-900 text-lg">{user.name}</p>
                       <p className="text-sm text-pink-600 capitalize font-medium">{user.role}</p>
                       {user.branchId && <p className="text-xs text-amber-600 font-bold mt-1 bg-amber-50 inline-block px-2 py-0.5 rounded-md w-fit"><Building2 size={10} className="inline mr-1"/>{getBranchName(user.branchId)}</p>}
                    </div>
                    <nav className="space-y-1 flex-1 overflow-y-auto p-4 scrollbar-thin scrollbar-thumb-pink-200">
                      <div className="text-xs font-bold text-gray-400 mb-2 px-2 uppercase tracking-wider">เมนูทั้งหมด</div>
                      {filteredMenu.map(item => (
                        <button key={item.id} onClick={() => { setView(item.id); setIsMobileMenuOpen(false); }} className={`w-full flex items-center space-x-3 px-4 py-3.5 rounded-xl transition-colors font-semibold ${view === item.id ? 'bg-gradient-to-r from-pink-500 to-pink-400 text-white shadow-md' : 'text-slate-700 hover:bg-pink-50 hover:text-pink-700'}`}>
                          {item.icon}<span>{item.label}</span>
                        </button>
                      ))}
                    </nav>
                    <div className="p-4 border-t border-gray-100 bg-white pb-safe">
                        <button onClick={onLogout} className="w-full flex items-center justify-center space-x-2 px-4 py-3.5 text-red-500 bg-red-50 hover:bg-red-100 rounded-xl font-bold transition">
                        <LogOut size={20} /><span>ออกจากระบบ</span>
                        </button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        };

        // --- App Entry Point ---
        const App = () => {
          const [user, setUser] = useState(null);
          const [loading, setLoading] = useState(true);
          useEffect(() => {
            const initAuth = async () => {
              try {
                if (typeof window.__initial_auth_token !== 'undefined' && window.__initial_auth_token) { 
                  await signInWithCustomToken(auth, window.__initial_auth_token); 
                } else { 
                  await signInAnonymously(auth); 
                }
              } catch (error) {
                console.warn("Using Custom Firebase: Switching to anonymous auth...");
                await signInAnonymously(auth);
              }
              const storedUser = localStorage.getItem(`expense_app_user_${appId}`);
              if (storedUser) { setUser(JSON.parse(storedUser)); }
              setLoading(false);
            };
            initAuth();
          }, []);
          const handleLogin = async (userData) => {
            const uid = userData.uid || auth.currentUser?.uid || 'guest_' + Date.now();
            const fullUser = { ...userData, uid: uid };
            setUser(fullUser);
            localStorage.setItem(`expense_app_user_${appId}`, JSON.stringify(fullUser));
            try { await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', uid), { name: userData.name, role: userData.role, branchId: userData.branchId || null, pin: userData.pin || '', lastLogin: serverTimestamp() }, { merge: true }); } catch (e) { console.error("Error saving user record:", e); }
          };
          const handleLogout = () => { setUser(null); localStorage.removeItem(`expense_app_user_${appId}`); };
          if (loading) return <div className="flex items-center justify-center h-screen text-gray-500">กำลังโหลดระบบ...</div>;
          return (
            <UIProvider>
              {user ? <MainApp user={user} onLogout={handleLogout} /> : <AuthScreen onLogin={handleLogin} />}
            </UIProvider>
          );
        };

        // Render application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
