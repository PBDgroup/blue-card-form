    <script type="text/babel" data-type="module">

        // --- Firebase Configuration ---
        const firebaseConfig = {
          apiKey: "AIzaSyCMvIuTUQf5FBmWCIZTV4T8erEP3s2QJVU",
          authDomain: "meowmeow-edc95.firebaseapp.com",
          projectId: "meowmeow-edc95",
          storageBucket: "meowmeow-edc95.firebasestorage.app",
          messagingSenderId: "153036998012",
          appId: "1:153036998012:web:cd588812d46545d45b90f9",
          measurementId: "G-SJ75GY2W0R"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof window.__app_id !== 'undefined' ? window.__app_id : 'default-app-id';

        // --- Constants & Utilities ---
        const COLORS = ['#0088FE', '#00C49F', '#FFBB28', '#FF8042', '#8884d8', '#ff7300', '#009688', '#9c27b0'];

        const EXPENSE_CATEGORIES = [
          { id: 'daily', name: 'ค่าใช้จ่ายรายวัน' },
          { id: 'monthly', name: 'ค่าใช้จ่ายรายเดือน' },
          { id: 'travel', name: 'ค่าเดินทาง' },
          { id: 'accommodation', name: 'ค่าที่พัก' },
          { id: 'evcharger', name: 'ค่าชาร์จรถไฟฟ้า' },
          { id: 'oil', name: 'ค่าน้ำมัน' },
          { id: 'fixed', name: 'ค่าใช้จ่ายคงที่' },
          { id: 'sender', name: 'ค่าส่งของ' },
        ];

        const BANKS = [
          { id: 'kbank', name: 'ธ.กสิกรไทย (KBANK)' },
          { id: 'scb', name: 'ธ.ไทยพาณิชย์ (SCB)' },
          { id: 'ktb', name: 'ธ.กรุงไทย (KTB)' },
          { id: 'bbl', name: 'ธ.กรุงเทพ (BBL)' },
          { id: 'ttb', name: 'ธ.ทหารไทยธนชาต (ttb)' },
          { id: 'gsb', name: 'ธ.ออมสิน (GSB)' },
          { id: 'bay', name: 'ธ.กรุงศรี (BAY)' },
          { id: 'other', name: 'อื่นๆ' }
        ];

        const ROLES = { ADMIN: 'admin', MANAGER: 'manager', EMPLOYEE: 'employee' };

        const STATUS = {
          PENDING: { label: 'รออนุมัติ', color: 'bg-yellow-100 text-yellow-800', lineText: 'รอการตรวจสอบ' },
          APPROVED: { label: 'อนุมัติแล้ว', color: 'bg-teal-100 text-teal-800', lineText: 'อนุมัติแล้ว' }, 
          WAITING_TRANSFER: { label: 'รอโอนเงิน', color: 'bg-blue-100 text-blue-800', lineText: 'ผ่านการอนุมัติ (รอโอน)' }, 
          TRANSFERRED: { label: 'โอนเงินแล้ว', color: 'bg-green-100 text-green-800', lineText: 'โอนเงินเรียบร้อย' }, 
          REJECTED: { label: 'ไม่อนุมัติ', color: 'bg-red-100 text-red-800', lineText: 'ถูกปฏิเสธ' }
        };

        // --- UI Context for Custom Alerts ---
        const UIContext = createContext();

        const UIProvider = ({ children }) => {
          const [alertData, setAlertData] = useState(null);
          const [confirmData, setConfirmData] = useState(null);

          const showAlert = (msg, type = 'error') => setAlertData({ msg, type });
          const showConfirm = (msg, onConfirm) => setConfirmData({ msg, onConfirm });

          return (
            <UIContext.Provider value={{ showAlert, showConfirm }}>
              {children}
              {alertData && (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/50 p-4 backdrop-blur-sm">
                  <div className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl animate-in zoom-in-95">
                    <div className={`flex items-center gap-3 mb-4 ${alertData.type === 'error' ? 'text-red-500' : 'text-green-500'}`}>
                      {alertData.type === 'error' ? <AlertCircle size={28} /> : <CheckCircle size={28} />}
                      <h3 className="font-bold text-xl">{alertData.type === 'error' ? 'ข้อผิดพลาด' : 'แจ้งเตือน'}</h3>
                    </div>
                    <p className="text-gray-700 mb-6 font-medium">{alertData.msg}</p>
                    <button onClick={() => setAlertData(null)} className="w-full bg-pink-50 hover:bg-pink-100 text-pink-700 border border-pink-200 font-bold py-3 rounded-xl transition-all">ตกลง</button>
                  </div>
                </div>
              )}
              {confirmData && (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/50 p-4 backdrop-blur-sm">
                  <div className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl animate-in zoom-in-95">
                    <div className="flex items-center gap-3 mb-4 text-amber-500">
                      <AlertCircle size={28} />
                      <h3 className="font-bold text-xl">ยืนยันการดำเนินการ</h3>
                    </div>
                    <p className="text-gray-700 mb-6 font-medium">{confirmData.msg}</p>
                    <div className="flex gap-3">
                      <button onClick={() => setConfirmData(null)} className="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-3 rounded-xl transition-all">ยกเลิก</button>
                      <button onClick={() => { confirmData.onConfirm(); setConfirmData(null); }} className="flex-1 bg-red-500 hover:bg-red-600 text-white font-bold py-3 rounded-xl transition-all shadow-md">ยืนยัน</button>
                    </div>
                  </div>
                </div>
              )}
            </UIContext.Provider>
          );
        };

        // --- Helper: Line Notification System ---
        const uploadImageToImgbb = async (base64String, apiKey) => {
          if (!apiKey) throw new Error("ไม่พบ Imgbb API Key");
          const base64Data = base64String.includes(',') ? base64String.split(',')[1] : base64String;
          const formData = new FormData();
          formData.append('image', base64Data);
          const response = await fetch(`https://api.imgbb.com/1/upload?key=${apiKey}`, { method: 'POST', body: formData });
          const data = await response.json();
          if (data.success) return data.data.url;
          throw new Error(data.error?.message || "อัปโหลดรูปไม่สำเร็จ");
        };

        const sendLineMessage = async (targetLineId, messagesArray, token, scriptUrl = '', setLogs = () => {}, showAlert) => {
          const addLog = (msg) => setLogs(prev => {
              const newLogs = [...(prev || []), `${new Date().toLocaleTimeString()} > ${msg}`];
              return newLogs.slice(-6); 
          });

          try {
            if (!token) throw new Error("Line Token is missing");
            if (!targetLineId) throw new Error("Target Line ID is missing");

            const cleanToken = token.trim(); 

            if (scriptUrl && scriptUrl.includes('script.google.com')) {
               addLog("🚀 ส่งผ่าน Google Apps Script...");
               try {
                 const response = await fetch(scriptUrl, {
                   method: 'POST',
                   headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                   body: JSON.stringify({ token: cleanToken, payload: { to: targetLineId.trim(), messages: messagesArray } })
                 });
                 if (!response.ok) throw new Error(`HTTP ${response.status}`);
                 const result = await response.json();
                 if (result.status === "success") {
                   addLog(`✅ ส่ง LINE สำเร็จ!`);
                   return true;
                 } else {
                   addLog(`⚠️ Script Error: ${result.message}`);
                   throw new Error(result.message);
                 }
               } catch (err) {
                 addLog(`⚠️ GAS Error: ${err.message}`);
                 throw new Error("Google Apps Script Error: " + err.message); 
               }
            }

            const LINE_API_URL = "https://api.line.me/v2/bot/message/push";
            const proxies = ["https://corsproxy.io/?", "https://thingproxy.freeboard.io/fetch/", "https://api.allorigins.win/raw?url=", ""];
            let response = null;
            let lastError = null;

            for (const proxy of proxies) {
              const fullUrl = proxy ? proxy + encodeURIComponent(LINE_API_URL) : LINE_API_URL;
              const finalUrl = (proxy.includes('corsproxy.io') || proxy.includes('thingproxy')) ? proxy + LINE_API_URL : fullUrl;
              try {
                response = await fetch(finalUrl, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${cleanToken}` },
                  body: JSON.stringify({ to: targetLineId, messages: messagesArray })
                 });
                if (response.ok || response.status >= 400) break;
              } catch (err) { lastError = err; }
            }

            if (!response) throw new Error(`การเชื่อมต่อถูกบล็อกทั้งหมด กรุณาตรวจสอบ Adblocker\nDetail: ${lastError?.message || ''}`);
            if (!response.ok) {
              const errorText = await response.text();
              let errorMsg = `Line API Error ${response.status}: `;
              if (response.status === 401) errorMsg += "Token ไม่ถูกต้อง หรือหมดอายุ";
              else if (response.status === 400) errorMsg += "รูปแบบข้อมูลผิด (Bad Request)";
              else if (response.status === 404) errorMsg += "ไม่พบ UserID นี้ (ยังไม่ได้แอด Bot)";
              else errorMsg += errorText;
              throw new Error(errorMsg);
            }
            return true;
          } catch (error) {
            if (showAlert) showAlert(`ส่งไลน์ไม่สำเร็จ: ${error.message}`, 'error');
            else console.error("Send Line Error:", error);
            return false;
          }
        };

        const createExpenseFlexMessage = (expense, newStatus, slipImage = null, approverName = null, companyName = null) => {
          const statusInfo = STATUS[newStatus.toUpperCase()] || STATUS.PENDING;
          const colorCode = newStatus === 'transferred' ? '#4ade80' : newStatus === 'rejected' ? '#f87171' : newStatus === 'waiting_transfer' ? '#60a5fa' : '#fbbf24';

          const safeItems = Array.isArray(expense.items) ? expense.items : [];
          const itemsPreview = safeItems.slice(0, 3).map(item => ({
            type: 'box', layout: 'horizontal',
            contents: [
              { type: 'text', text: `• ${item.description || 'ไม่มีชื่อ'}`, size: 'xxs', color: '#555555', flex: 3, wrap: true },
              { type: 'text', text: `${parseFloat(item.amount || 0).toLocaleString()}`, size: 'xxs', color: '#111111', align: 'end', flex: 1 }
            ]
          }));

          if (safeItems.length > 3) itemsPreview.push({ type: 'text', text: `... และอีก ${safeItems.length - 3} รายการ`, size: 'xxs', color: '#aaaaaa', margin: 'xs', align: 'center' });
          if (itemsPreview.length === 0) itemsPreview.push({ type: 'text', text: '-', size: 'xxs', color: '#aaaaaa' });

          let dateDisplay = '-';
          try {
            let d = expense.date && typeof expense.date.seconds === 'number' ? new Date(expense.date.seconds * 1000) : (expense.date instanceof Date ? expense.date : new Date());
            dateDisplay = d.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' });
          } catch (e) {}

          const flexMessage = {
            type: 'flex', altText: `สถานะใบเบิก ${expense.runNumber || ''}: ${statusInfo.lineText}`,
            contents: {
              type: 'bubble',
              header: {
                type: 'box', layout: 'vertical',
                contents: [
                  { type: 'text', text: statusInfo.lineText, color: '#ffffff', weight: 'bold', size: 'lg' },
                  { type: 'text', text: expense.runNumber || 'NO-ID', color: '#ffffffcc', size: 'xs', margin: 'xs' },
                  { type: 'text', text: dateDisplay, color: '#ffffffaa', size: 'xxs', margin: 'none' }
                ], backgroundColor: colorCode, paddingAll: '20px'
              },
              body: {
                type: 'box', layout: 'vertical',
                contents: [
                  ...(companyName ? [{ type: 'text', text: companyName, size: 'xs', color: '#aaaaaa', weight: 'bold', margin: 'sm' }] : []),
                  { type: 'text', text: expense.description || 'ไม่ระบุรายละเอียด', weight: 'bold', size: 'md', wrap: true },
                  { type: 'text', text: `ผู้เบิก: ${expense.userName || 'Unknown'}`, size: 'xs', color: '#888888', margin: 'sm' },
                  ...(approverName ? [{ type: 'text', text: `ผู้อนุมัติ: ${approverName}`, size: 'xs', color: '#888888', margin: 'xs' }] : []),
                  { type: 'separator', margin: 'md', color: '#eeeeee' },
                  { type: 'box', layout: 'vertical', margin: 'md', spacing: 'sm', contents: itemsPreview },
                  { type: 'separator', margin: 'md', color: '#eeeeee' },
                  { type: 'box', layout: 'horizontal', margin: 'md', contents: [
                      { type: 'text', text: 'ยอดรวมสุทธิ', size: 'sm', color: '#555555', flex: 1, weight: 'bold' },
                      { type: 'text', text: `${parseFloat(expense.amount || 0).toLocaleString()} บาท`, size: 'lg', color: colorCode, weight: 'bold', align: 'end', flex: 2 }
                  ]}
                ]
              }
            }
          };

          if (newStatus === 'transferred' && slipImage) {
            if (typeof slipImage === 'string' && slipImage.startsWith('http')) {
               flexMessage.contents.hero = {
                 type: 'image',
                 url: slipImage,
                 size: 'full',
                 aspectRatio: '1:1',
                 aspectMode: 'fit',
                 backgroundColor: '#f8f9fa'
               };
               flexMessage.contents.body.contents.push({ type: 'text', text: '📷 หลักฐานการโอนเงินดูได้จากรูปด้านบน', size: 'xs', color: '#1db446', margin: 'md', weight: 'bold', align: 'center' });
            } else {
               flexMessage.contents.body.contents.push({ type: 'text', text: '📷 มีหลักฐานการโอนแนบมาในระบบ', size: 'xs', color: '#1db446', margin: 'md', weight: 'bold', align: 'center' });
               flexMessage.contents.body.contents.push({ type: 'text', text: '(ไม่สามารถแสดงรูปในแชทได้เนื่องจากข้อจำกัดของ LINE API กรุณาดูในระบบ)', size: 'xxs', color: '#888888', margin: 'xs', align: 'center' });
            }
          }

          if (newStatus === 'rejected' && expense.rejectReason) {
            flexMessage.contents.body.contents.push({ type: 'text', text: `⚠️ เหตุผลที่ปฏิเสธ: ${expense.rejectReason}`, size: 'sm', color: '#ef4444', margin: 'md', weight: 'bold', wrap: true });
          }

          return flexMessage;
        };

        // --- Components ---

        const AuthScreen = ({ onLogin }) => {
          const { showAlert } = useContext(UIContext);
          const [users, setUsers] = useState([]);
          const [selectedUserId, setSelectedUserId] = useState('');
          const [pinInput, setPinInput] = useState('');
          const [loading, setLoading] = useState(true);
          const [companyName, setCompanyName] = useState('ระบบเบิกจ่ายเงิน (รุ่นน้องแมว)');
          
          // ข้อมูลสำหรับสร้าง Admin คนแรก
          const [setupName, setSetupName] = useState('');
          const [setupPin, setSetupPin] = useState('');

          useEffect(() => {
            const fetchSettings = async () => {
               try {
                  const snap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'config'));
                  if (snap.exists() && snap.data().companyName) setCompanyName(snap.data().companyName);
               } catch (e) {}
            };
            fetchSettings();
          }, []);

          useEffect(() => {
            const unsubUsers = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'users'), (snap) => {
              const data = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              setUsers(data);
              if (data.length > 0 && !selectedUserId) setSelectedUserId(data[0].id);
              setLoading(false);
            });
            return () => { unsubUsers(); };
          }, [selectedUserId]);

          useEffect(() => {
            if (pinInput.length === 4) {
              const timer = setTimeout(() => { handleLoginSubmit(); }, 200); 
              return () => clearTimeout(timer);
            }
          }, [pinInput]);

          const handleNumpadClick = (num) => { if (pinInput.length < 4) setPinInput(prev => prev + num); };
          const handleBackspace = () => { setPinInput(prev => prev.slice(0, -1)); };

          const handleLoginSubmit = () => {
            if (!selectedUserId) return showAlert('กรุณาเลือกผู้ใช้งาน (หากไม่มี กรุณาติดต่อผู้ดูแลระบบ)');
            if (pinInput.length !== 4) return showAlert('กรุณากรอก PIN 4 หลัก');
            const user = users.find(u => u.id === selectedUserId);
            if (!user) return showAlert('ไม่พบข้อมูลผู้ใช้งาน');
            if (user.pin && user.pin !== pinInput) { showAlert('รหัส PIN ไม่ถูกต้อง'); setPinInput(''); return; }
            onLogin({ ...user, uid: user.id });
          };

          const handleSetupAdmin = () => {
            if (!setupName) return showAlert('กรุณาระบุชื่อแอดมิน');
            if (setupPin.length !== 4) return showAlert('กรุณาตั้งรหัส PIN 4 หลัก');
            // สร้างบัญชีแรกให้เป็น Admin เสมอ
            onLogin({ name: setupName, role: ROLES.ADMIN, branchId: 'HEADQUARTER', pin: setupPin });
          };

          return (
            <div className="min-h-screen paw-bg flex items-center justify-center p-4 font-sans pb-safe">
              <div className="bg-white rounded-3xl shadow-xl w-full max-w-md overflow-hidden border-4 border-pink-200">
                <div className="bg-pink-500 p-6 text-center text-white relative overflow-hidden">
                  <div className="absolute top-[-20px] right-[-20px] opacity-20"><PawPrint size={100} /></div>
                  <div className="bg-white/20 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 backdrop-blur-sm shadow-inner"><Cat className="text-white" size={32} /></div>
                  <h1 className="text-2xl font-bold tracking-wide">MeowExpense 🐾</h1>

                </div>
                <div className="p-6">
                  {loading ? (
                    <div className="text-center text-pink-400 py-10 font-bold">กำลังตรวจสอบข้อมูล...</div>

                    <div className="space-y-4 animate-in fade-in">
                      <div className="bg-amber-50 text-amber-800 p-4 rounded-xl text-sm mb-4 border border-amber-200 shadow-sm">
                        <p className="font-bold mb-1 flex items-center gap-1"><AlertCircle size={16}/> ระบบยังไม่มีผู้ใช้งาน</p>
                        <p>กรุณาสร้างบัญชี <b>"ผู้ดูแลระบบคนแรก"</b> เพื่อเริ่มใช้งาน (ฟอร์มนี้จะหายไปเมื่อมีแอดมินแล้ว และแอดมินจะต้องเป็นคนเพิ่มพนักงานเองค่ะ)</p>
                      </div>
                      <div><label className="block text-sm font-medium text-pink-700 mb-1">ชื่อ-นามสกุล (Admin)</label><input type="text" className="w-full p-3 border-2 border-pink-100 rounded-xl focus:ring-4 focus:ring-pink-500/20 focus:border-pink-400 outline-none transition-all" placeholder="เช่น ผู้ดูแลระบบ" value={setupName} onChange={(e) => setSetupName(e.target.value)} /></div>
                      <div><label className="block text-sm font-medium text-pink-700 mb-1">ตั้งรหัส PIN (4 หลัก)</label><input type="text" maxLength={4} inputMode="numeric" className="w-full p-3 border-2 border-pink-100 rounded-xl text-center tracking-[1em] font-bold text-xl text-pink-600 focus:ring-4 focus:ring-pink-500/20 focus:border-pink-400 outline-none transition-all" placeholder="0000" value={setupPin} onChange={(e) => { const val = e.target.value.replace(/[^0-9]/g, ''); setSetupPin(val); }} /></div>
                      <button onClick={handleSetupAdmin} className="w-full bg-amber-600 text-white py-4 rounded-xl hover:bg-amber-700 transition font-bold shadow-lg shadow-amber-600/30 mt-2 flex justify-center items-center gap-2"><UserCheck size={20}/> สร้างแอดมินคนแรก</button>
                    </div>
                  ) : (
                    <div className="space-y-6 animate-in fade-in">
                      <div>
                        <label className="block text-sm font-medium text-pink-700 mb-2 flex items-center gap-2"><PawPrint size={16}/> เลือกผู้ใช้งาน</label>
                        <div className="relative">
                          <select className="w-full p-3 pl-10 border-2 border-pink-100 rounded-2xl appearance-none bg-pink-50/30 focus:ring-4 focus:ring-pink-500/20 focus:border-pink-400 outline-none transition-all text-gray-700 font-medium" value={selectedUserId} onChange={(e) => { setSelectedUserId(e.target.value); setPinInput(''); }}>
                            {users.map(u => (<option key={u.id} value={u.id}>{u.name} ({u.role})</option>))}
                          </select>
                          <Cat className="absolute left-3 top-3.5 text-pink-400" size={20} />
                        </div>
                      </div>
                      <div className="flex justify-center gap-4 my-4">
                        {[0, 1, 2, 3].map(i => (<div key={i} className={`w-4 h-4 rounded-full transition-all ${i < pinInput.length ? 'bg-pink-500 scale-125 shadow-md' : 'bg-pink-100'}`} />))}
                      </div>
                      <div className="grid grid-cols-3 gap-3 max-w-[240px] mx-auto">
                        {[1, 2, 3, 4, 5, 6, 7, 8, 9].map(num => (<button key={num} onClick={() => handleNumpadClick(num.toString())} className="w-16 h-16 rounded-full bg-pink-50 hover:bg-pink-100 text-xl font-bold text-pink-700 shadow-sm transition active:scale-95 mx-auto border border-pink-100">{num}</button>))}
                        <div className="w-16 h-16"></div>
                        <button onClick={() => handleNumpadClick('0')} className="w-16 h-16 rounded-full bg-pink-50 hover:bg-pink-100 text-xl font-bold text-pink-700 shadow-sm transition active:scale-95 mx-auto border border-pink-100">0</button>
                        <button onClick={handleBackspace} className="w-16 h-16 rounded-full bg-red-50 hover:bg-red-100 text-red-500 shadow-sm transition active:scale-95 flex items-center justify-center mx-auto border border-red-100"><ArrowLeft size={24} /></button>
                      </div>
                      <button onClick={handleLoginSubmit} className="w-full bg-pink-500 text-white py-4 rounded-2xl font-bold hover:bg-pink-600 shadow-lg shadow-pink-500/30 transition-all mt-4 flex justify-center items-center gap-2"><Cat size={20}/> เข้าสู่ระบบ</button>
                    </div>
                  )}
                  
                  <div className="mt-8 text-center border-t border-pink-100 pt-4">
                    <button onClick={() => { localStorage.clear(); window.location.reload(); }} className="text-xs font-medium text-pink-400 hover:text-pink-600 underline flex items-center justify-center gap-1 mx-auto transition-all active:scale-95"><RefreshCw size={12}/> ล้างข้อมูลเก่า / แก้ปัญหาเข้าสู่ระบบไม่ได้</button>
                  </div>
                </div>
              </div>

          );
        };

        const DashboardView = ({ expenses, user, branches }) => {
          const [dateRange, setDateRange] = useState({ start: '', end: '' });
          const [filterBranch, setFilterBranch] = useState('ALL');

          useEffect(() => {
            const now = new Date();
            const firstDay = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
            const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0).toISOString().split('T')[0];
            setDateRange({ start: firstDay, end: lastDay });
          }, []);

          const filteredExpenses = useMemo(() => {
            return expenses.filter(e => {
              let matches = true;
              if (dateRange.start && dateRange.end) {
                const expenseDate = e.date?.seconds ? new Date(e.date.seconds * 1000) : new Date(e.date);
                const start = new Date(dateRange.start);
                const end = new Date(dateRange.end);
                end.setHours(23, 59, 59, 999); 
                if (expenseDate < start || expenseDate > end) matches = false;
              }
              if (filterBranch !== 'ALL' && e.branchId !== filterBranch) matches = false;
              return matches;
            });
          }, [expenses, dateRange, filterBranch]);

          const pendingAmount = filteredExpenses.filter(e => e.status === 'pending').reduce((sum, e) => sum + parseFloat(e.amount), 0);
          const waitingTransferAmount = filteredExpenses.filter(e => e.status === 'waiting_transfer').reduce((sum, e) => sum + parseFloat(e.amount), 0);
          const transferredAmount = filteredExpenses.filter(e => e.status === 'transferred' || e.status === 'approved').reduce((sum, e) => sum + parseFloat(e.amount), 0);
          const totalAmount = filteredExpenses.reduce((sum, e) => e.status !== 'rejected' ? sum + parseFloat(e.amount) : sum, 0);

          const categoryData = useMemo(() => {
            const data = {};
            filteredExpenses.filter(e => e.status !== 'rejected').forEach(e => {
              if (e.items && Array.isArray(e.items)) {
                e.items.forEach(item => { data[item.category] = (data[item.category] || 0) + parseFloat(item.amount); });
              } else {
                data[e.category] = (data[e.category] || 0) + parseFloat(e.amount);
              }
            });
            return Object.keys(data).map(key => ({
              name: EXPENSE_CATEGORIES.find(c => c.id === key)?.name || key,
              value: data[key]
            })).sort((a,b) => b.value - a.value).filter(d => d.value > 0);
          }, [filteredExpenses]);

          const branchData = useMemo(() => {
            const data = {};
            filteredExpenses.filter(e => e.status !== 'rejected').forEach(e => {
                const branchName = e.branchId === 'HEADQUARTER' ? 'สำนักงานใหญ่' : (branches.find(b => b.id === e.branchId)?.name || 'ไม่ระบุ');
                data[branchName] = (data[branchName] || 0) + parseFloat(e.amount);
            });
            return Object.keys(data).map(key => ({ name: key, value: data[key] })).sort((a,b) => b.value - a.value).filter(d => d.value > 0);
          }, [filteredExpenses, branches]);

          return (
            <div className="space-y-6">
              <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col md:flex-row gap-4 items-center justify-between">

                  <div className="flex flex-col md:flex-row gap-4 w-full md:w-auto">
                     <div className="flex items-center gap-2 w-full md:w-auto">
                         <span className="text-sm text-gray-500 whitespace-nowrap">จาก:</span>
                         <input type="date" className="border rounded-lg p-2 text-sm flex-1 md:w-auto" value={dateRange.start} onChange={e => setDateRange({...dateRange, start: e.target.value})} />
                         <span className="text-sm text-gray-500 whitespace-nowrap">ถึง:</span>
                         <input type="date" className="border rounded-lg p-2 text-sm flex-1 md:w-auto" value={dateRange.end} onChange={e => setDateRange({...dateRange, end: e.target.value})} />
                     </div>
                     <div className="flex items-center gap-2 w-full md:w-auto">
                         <span className="text-sm text-gray-500 whitespace-nowrap">สาขา:</span>
                         <select className="border rounded-lg p-2 text-sm flex-1 md:w-auto min-w-[150px]" value={filterBranch} onChange={e => setFilterBranch(e.target.value)}>
                             <option value="ALL">ทั้งหมด</option>
                             {branches.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
                             <option value="HEADQUARTER">สำนักงานใหญ่</option>
                         </select>
                     </div>
                  </div>
              </div>

              <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div className="bg-white p-4 md:p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col justify-between">
                  <p className="text-gray-500 text-xs md:text-sm">รออนุมัติ</p>
                  <div className="flex items-center justify-between mt-2">
                    <h3 className="text-lg md:text-2xl font-bold text-yellow-600 truncate">฿{pendingAmount.toLocaleString()}</h3>
                    <div className="p-1.5 md:p-2 bg-yellow-100 rounded-full text-yellow-600 hidden sm:block"><History size={20}/></div>
                  </div>
                </div>
                <div className="bg-white p-4 md:p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col justify-between">
                  <p className="text-gray-500 text-xs md:text-sm">รอโอนเงิน</p>
                  <div className="flex items-center justify-between mt-2">
                    <h3 className="text-lg md:text-2xl font-bold text-blue-600 truncate">฿{waitingTransferAmount.toLocaleString()}</h3>
                    <div className="p-1.5 md:p-2 bg-blue-100 rounded-full text-blue-600 hidden sm:block"><CreditCard size={20}/></div>
                  </div>
                </div>
                <div className="bg-white p-4 md:p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col justify-between">
                  <p className="text-gray-500 text-xs md:text-sm">โอนเงินแล้ว</p>
                  <div className="flex items-center justify-between mt-2">
                    <h3 className="text-lg md:text-2xl font-bold text-green-600 truncate">฿{transferredAmount.toLocaleString()}</h3>
                    <div className="p-1.5 md:p-2 bg-green-100 rounded-full text-green-600 hidden sm:block"><CheckCircle size={20}/></div>
                  </div>
                </div>
                <div className="bg-white p-4 md:p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col justify-between">
                  <p className="text-gray-500 text-xs md:text-sm">ยอดรวม</p>
                  <div className="flex items-center justify-between mt-2">
                    <h3 className="text-lg md:text-2xl font-bold text-gray-800 truncate">฿{totalAmount.toLocaleString()}</h3>
                    <div className="p-1.5 md:p-2 bg-gray-100 rounded-full text-gray-600 hidden sm:block"><Wallet size={20}/></div>
                  </div>
                </div>
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div className="bg-white p-5 md:p-6 rounded-xl shadow-sm border flex flex-col h-[600px] md:h-[550px]">
                  <h3 className="font-semibold text-gray-700 mb-4">สัดส่วนตามหมวดหมู่</h3>
                  <div className="h-[250px] mb-4 shrink-0">
                    {categoryData.length > 0 ? (
                        <ResponsiveContainer width="100%" height="100%">
                        <PieChart>
                            <Pie data={categoryData} cx="50%" cy="50%" outerRadius={80} fill="#8884d8" dataKey="value" label={({name, percent}) => `${(percent * 100).toFixed(0)}%`}>
                            {categoryData.map((entry, index) => (<Cell key={`cell-${index}`} fill={COLORS[index % COLORS.length]} />))}
                            </Pie>
                            <RechartsTooltip formatter={(value) => `฿${value.toLocaleString()}`} />
                            <Legend />
                        </PieChart>
                        </ResponsiveContainer>
                    ) : <div className="h-full flex items-center justify-center text-gray-400">ไม่มีข้อมูล</div>}
                  </div>
                  <div className="flex-1 overflow-auto border-t pt-2 w-full">
                      <div className="min-w-[300px]">
                          <table className="w-full text-sm text-left">
                              <thead className="bg-gray-50 text-gray-600"><tr><th className="p-2">หมวดหมู่</th><th className="p-2 text-right">จำนวนเงิน</th><th className="p-2 text-right">%</th></tr></thead>
                              <tbody>
                                  {categoryData.map((d, idx) => (
                                      <tr key={idx} className="border-b last:border-0 hover:bg-gray-50">
                                          <td className="p-2 flex items-center gap-2"><span className="w-3 h-3 rounded-full shrink-0" style={{backgroundColor: COLORS[idx % COLORS.length]}}></span><span className="truncate">{d.name}</span></td>
                                          <td className="p-2 text-right font-medium">฿{d.value.toLocaleString()}</td>
                                          <td className="p-2 text-right text-gray-500">{((d.value/totalAmount)*100).toFixed(1)}%</td>
                                      </tr>
                                  ))}
                              </tbody>
                          </table>
                      </div>
                  </div>
                </div>

                <div className="bg-white p-5 md:p-6 rounded-xl shadow-sm border h-[500px] md:h-[550px] flex flex-col">
                  <h3 className="font-semibold mb-4 text-gray-700">รายการล่าสุด</h3>
                  <div className="flex-1 overflow-y-auto space-y-3 pr-2 scrollbar-thin scrollbar-thumb-gray-200">
                     {filteredExpenses.length > 0 ? filteredExpenses.slice(0, 50).map(e => (
                       <div key={e.id} className="flex justify-between items-center p-3 hover:bg-gray-50 rounded-lg border-b last:border-0">
                         <div className="overflow-hidden flex-1 pr-2">
                           <p className="font-medium text-gray-800 text-sm truncate">{e.description}</p>
                           <div className="flex items-center gap-2 mt-1">
                             <span className="text-[10px] text-blue-500 bg-blue-50 px-1 rounded font-mono shrink-0">{e.runNumber}</span>
                             <span className="text-[10px] text-gray-500 shrink-0">{new Date(e.date?.seconds * 1000).toLocaleDateString('th-TH')}</span>
                           </div>
                         </div>
                         <div className="text-right shrink-0">
                           <p className="font-bold text-gray-800 text-sm">฿{parseFloat(e.amount).toLocaleString()}</p>
                           <span className={`text-[10px] px-2 py-0.5 rounded-full ${STATUS[e.status.toUpperCase()]?.color || 'bg-gray-100'}`}>
                             {STATUS[e.status.toUpperCase()]?.label || e.status}
                           </span>
                         </div>
                       </div>
                     )) : <p className="text-gray-400 text-center mt-10">ไม่มีรายการตามเงื่อนไขที่เลือก</p>}
                  </div>
                </div>
              </div>

              <div className="bg-white p-5 md:p-6 rounded-xl shadow-sm border flex flex-col overflow-hidden">
                  <h3 className="font-semibold text-gray-700 mb-4">สรุปค่าใช้จ่ายตามสาขา</h3>
                  <div className="h-[250px] md:h-[300px] mb-6 min-w-[300px] overflow-x-auto">
                    {branchData.length > 0 ? (
                        <div className="min-w-[500px] h-full">
                            <ResponsiveContainer width="100%" height="100%">
                                <BarChart data={branchData} margin={{top: 5, right: 30, left: 20, bottom: 5}}>
                                    <CartesianGrid strokeDasharray="3 3" vertical={false} />
                                    <XAxis dataKey="name" tick={{fontSize: 12}} />
                                    <YAxis tickFormatter={(val) => `฿${val/1000}k`} />
                                    <RechartsTooltip formatter={(value) => `฿${value.toLocaleString()}`} cursor={{fill: '#f3f4f6'}} />
                                    <Bar dataKey="value" fill="#3b82f6" radius={[4, 4, 0, 0]} name="ยอดใช้จ่าย" />
                                </BarChart>
                            </ResponsiveContainer>
                        </div>
                    ) : <div className="h-full flex items-center justify-center text-gray-400">ไม่มีข้อมูลสาขา</div>}
                  </div>
                  <div className="overflow-x-auto">
                      <table className="w-full text-sm text-left border rounded-lg min-w-[500px]">
                          <thead className="bg-gray-100 text-gray-700 font-semibold">
                              <tr>
                                  <th className="p-3">ชื่อสาขา</th>
                                  <th className="p-3 text-right">ยอดรวม (บาท)</th>
                                  <th className="p-3 text-right">สัดส่วน (%)</th>
                                  <th className="p-3 text-center">สถานะ</th>
                              </tr>
                          </thead>
                          <tbody className="divide-y">
                              {branchData.map((d, idx) => (
                                  <tr key={idx} className="hover:bg-gray-50">
                                      <td className="p-3 font-medium text-gray-800">{d.name}</td>
                                      <td className="p-3 text-right text-blue-600 font-bold">฿{d.value.toLocaleString()}</td>
                                      <td className="p-3 text-right text-gray-500">
                                          <div className="flex items-center justify-end gap-2">
                                              <div className="w-16 h-2 bg-gray-200 rounded-full overflow-hidden hidden sm:block">
                                                  <div className="h-full bg-blue-500" style={{width: `${(d.value/totalAmount)*100}%`}}></div>
                                              </div>
                                              <span>{((d.value/totalAmount)*100).toFixed(1)}%</span>
                                          </div>
                                      </td>
                                      <td className="p-3 text-center"><span className="bg-green-100 text-green-700 px-2 py-0.5 rounded text-xs">Active</span></td>
                                  </tr>
                              ))}
                              <tr className="bg-gray-50 font-bold">
                                  <td className="p-3">รวมทั้งหมด</td>
                                  <td className="p-3 text-right">฿{totalAmount.toLocaleString()}</td>
                                  <td className="p-3 text-right">100%</td>
                                  <td></td>
                              </tr>
                          </tbody>
                      </table>
                  </div>
              </div>
            </div>
          );
        };

        const RequestForm = ({ user, setView, branches, expenses }) => {
          const { showAlert } = useContext(UIContext);
          const [items, setItems] = useState([]);
          const [currentItem, setCurrentItem] = useState({ amount: '', category: 'daily', description: '', date: new Date().toISOString().split('T')[0], receipt: null });
          const [bankInfo, setBankInfo] = useState({ bank: 'kbank', accountName: user.name || '', accountNumber: '' });
          const [loading, setLoading] = useState(false);
          const [approvers, setApprovers] = useState([]);
          const [selectedApproverId, setSelectedApproverId] = useState('');

          const totalAmount = items.reduce((sum, item) => sum + parseFloat(item.amount || 0), 0);
          const isAutoApprove = user.role === ROLES.MANAGER;

          useEffect(() => {
            const unsub = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'users'), (snap) => {
                const allUsers = snap.docs.map(d => ({id: d.id, ...d.data()}));
                const eligible = allUsers.filter(u => u.role === 'manager');
                setApprovers(eligible);
                if (eligible.length > 0 && !selectedApproverId) setSelectedApproverId(eligible[0].id);
            });
            return () => unsub();
          }, [selectedApproverId]);

          const checkDuplicateReceipt = (base64Data) => {
            if (!base64Data) return false;
            if (items.some(item => item.receipt === base64Data)) return true;
            if (expenses && expenses.length > 0) {
              for (const exp of expenses) {
                if (exp.status !== 'rejected') {
                  if (exp.items && Array.isArray(exp.items)) {
                    if (exp.items.some(item => item.receipt === base64Data)) return true;
                  }
                }
              }
            }
            return false;
          };

          const handleFileChange = (e) => {
            const file = e.target.files[0];
            if (file) {
              if (file.size > 800 * 1024) { 
                 showAlert("ขนาดรูปภาพต้องไม่เกิน 800KB", 'error');
                 e.target.value = null;
                 return;
              }
              const reader = new FileReader();
              reader.onloadend = () => {
                 const base64Data = reader.result;
                 if (checkDuplicateReceipt(base64Data)) {
                    showAlert("ข้อมูลนี้คุณได้เบิกไปแล้ว พบสลิปหรือหลักฐานการเบิกเงินซ้ำในระบบ", 'error');
                    e.target.value = null;
                    return;
                 }
                 setCurrentItem(prev => ({ ...prev, receipt: base64Data }));
              };
              reader.readAsDataURL(file);
            }
          };
          
          const handleAddItem = (e) => {
            e.preventDefault(); 
            if (!currentItem.amount || !currentItem.description.trim() || !currentItem.date) return showAlert('กรุณากรอกข้อมูลให้ครบถ้วน');
            setItems([...items, { ...currentItem, id: Date.now() }]);
            setCurrentItem(prev => ({ ...prev, amount: '', description: '', receipt: null }));
            const fileInput = document.getElementById('receipt-upload');
            if (fileInput) fileInput.value = '';
          };
          const handleRemoveItem = (id) => setItems(items.filter(item => item.id !== id));
          
          const generateExpenseId = async (branchId) => {
            let prefix = "HQ";
            if (branchId && branchId !== 'HEADQUARTER') {
                const branchSnap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'branches', branchId));
                if (branchSnap.exists()) {
                     const bData = branchSnap.data();
                     prefix = bData.location || (bData.name ? bData.name.substring(0, 3).toUpperCase() : 'BR');
                }
            }
            const counterRef = doc(db, 'artifacts', appId, 'public', 'data', 'counters', 'expenses_running');
            let newCount = 1;
            await runTransaction(db, async (transaction) => {
                const sfDoc = await transaction.get(counterRef);
                if (!sfDoc.exists()) { transaction.set(counterRef, { count: 1 }); newCount = 1; } 
                else { newCount = sfDoc.data().count + 1; transaction.update(counterRef, { count: newCount }); }
            });
            return `${prefix}-${String(newCount).padStart(5, '0')}`;
          };

          const handleSubmitAll = async () => {
            if (items.length === 0) return;
            if (!bankInfo.accountNumber || !bankInfo.accountName) return showAlert('กรุณาระบุข้อมูลบัญชีรับเงินให้ครบถ้วน');
            if (!isAutoApprove && !selectedApproverId) return showAlert('กรุณาเลือกผู้อนุมัติรายการ');

            setLoading(true);
            try {
              const runNumber = await generateExpenseId(user.branchId);

              const initialStatus = isAutoApprove ? 'waiting_transfer' : 'pending';
              const expenseData = {
                  runNumber, amount: totalAmount, description: `ใบเบิกค่าใช้จ่าย (${items.length} รายการ)`, items: items, 
                  date: new Date(), status: initialStatus, userId: user.uid, userName: user.name, branchId: user.branchId, 
                  createdBy: user.uid, createdAt: serverTimestamp(), category: 'mixed', targetApproverId: isAutoApprove ? user.uid : selectedApproverId, 
                  bankDetails: { 
                    bankId: bankInfo.bank, bankName: BANKS.find(b => b.id === bankInfo.bank)?.name || bankInfo.bank, 
                    accountName: bankInfo.accountName, accountNumber: bankInfo.accountNumber 
                  }
              };

              if (isAutoApprove) {
                  expenseData.approverId = user.uid;
                  expenseData.approvedAt = serverTimestamp();
              }

              await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'expenses'), expenseData);
              
              const settingsSnap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'config'));
              const settings = settingsSnap.data();
              
              if (settings?.lineToken && !isAutoApprove) {
                 const targetUser = approvers.find(u => u.id === selectedApproverId);
                 if (targetUser && targetUser.lineUserId) {
                    const message = createExpenseFlexMessage(expenseData, 'pending', null, null, settings.companyName);
                    message.contents.header.contents[0].text = "📝 มีรายการเบิกใหม่ถึงคุณ";
                    await sendLineMessage(targetUser.lineUserId, [message], settings.lineToken, settings.scriptUrl, undefined, showAlert);
                 }
              }
              showAlert(`บันทึกใบเบิกเรียบร้อยแล้ว เลขที่ ${runNumber}`, 'success'); 
              setView('history');
            } catch (error) { console.error(error); showAlert('เกิดข้อผิดพลาดในการบันทึกข้อมูล: ' + error.message); }
            setLoading(false);
          };

          return (
            <div className="max-w-4xl mx-auto space-y-6">
               <div className="bg-white p-5 md:p-6 rounded-xl shadow-sm border border-gray-100">
                  <h2 className="text-xl font-bold mb-6 flex items-center gap-2 text-gray-800"><PlusCircle className="text-blue-600" /> ขอเบิกค่าใช้จ่าย (สร้างใบเบิก)</h2>
                  <form onSubmit={handleAddItem}>
                    <div className="grid grid-cols-1 md:grid-cols-12 gap-4 items-end">
                        <div className="md:col-span-3"><label className="block text-xs font-medium text-gray-700 mb-1">วันที่ (รายการ) <span className="text-red-500">*</span></label><input type="date" required className="w-full p-2 border rounded-lg text-sm" value={currentItem.date} onChange={e => setCurrentItem({...currentItem, date: e.target.value})}/></div>
                        <div className="md:col-span-3"><label className="block text-xs font-medium text-gray-700 mb-1">หมวดหมู่ <span className="text-red-500">*</span></label><select className="w-full p-2 border rounded-lg text-sm" required value={currentItem.category} onChange={e => setCurrentItem({...currentItem, category: e.target.value})}>{EXPENSE_CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}</select></div>
                        <div className="md:col-span-6"><label className="block text-xs font-medium text-gray-700 mb-1">รายละเอียด <span className="text-red-500">*</span></label><input type="text" required className="w-full p-2 border rounded-lg text-sm" placeholder="รายละเอียดค่าใช้จ่าย" value={currentItem.description} onChange={e => setCurrentItem({...currentItem, description: e.target.value})}/></div>
                        <div className="md:col-span-3"><label className="block text-xs font-medium text-gray-700 mb-1">จำนวนเงิน <span className="text-red-500">*</span></label><input type="number" required min="0.01" step="0.01" className="w-full p-2 border rounded-lg text-sm" placeholder="0.00" value={currentItem.amount} onChange={e => setCurrentItem({...currentItem, amount: e.target.value})}/></div>
                        <div className="md:col-span-5"><label className="block text-xs font-medium text-gray-700 mb-1">แนบรูปใบเสร็จ</label><div className="flex items-center gap-2"><label className="cursor-pointer bg-gray-50 border border-gray-300 text-gray-600 px-3 py-2 rounded-lg hover:bg-gray-100 flex items-center gap-2 text-sm w-full truncate"><Paperclip size={16}/><span className="truncate">{currentItem.receipt ? 'แนบรูปแล้ว' : 'เลือกรูปภาพ...'}</span><input id="receipt-upload" type="file" accept="image/*" className="hidden" onChange={handleFileChange}/></label>{currentItem.receipt && (<div className="relative group"><img src={currentItem.receipt} className="h-10 w-10 object-cover rounded border" alt="Preview"/><button type="button" onClick={() => { setCurrentItem({...currentItem, receipt: null}); document.getElementById('receipt-upload').value = ''; }} className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-0.5 hover:bg-red-600"><X size={12}/></button></div>)}</div></div>
                        <div className="md:col-span-4"><button type="submit" className="w-full bg-pink-50 text-pink-600 px-4 py-2 rounded-xl font-semibold hover:bg-pink-100 transition flex items-center justify-center gap-2 border border-pink-200"><PawPrint size={18} /> เพิ่มลงรายการ</button></div>
                    </div>
                  </form>
               </div>
               
               {items.length > 0 && (
                 <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden mt-6">
                    <div className="p-4 bg-gray-50 border-b flex justify-between items-center"><h3 className="font-semibold text-gray-700">รายการในใบเบิก ({items.length})</h3><button onClick={() => setItems([])} className="text-xs text-red-500 hover:text-red-700 bg-red-50 px-2 py-1 rounded">ล้างทั้งหมด</button></div>
                    <div className="overflow-x-auto">
                        <table className="w-full text-left min-w-[500px]">
                            <tbody className="divide-y">{items.map((item, index) => (<tr key={item.id} className="group hover:bg-gray-50"><td className="p-4 text-sm text-gray-500 w-12">{index + 1}</td><td className="p-4 text-sm"><div className="font-medium text-gray-800">{item.description}</div><div className="text-xs text-gray-500">{item.date} • {EXPENSE_CATEGORIES.find(c => c.id === item.category)?.name}</div></td><td className="p-4 text-sm font-bold text-gray-800 text-right">฿{parseFloat(item.amount).toLocaleString()}</td><td className="p-4 text-right w-16"><button onClick={() => handleRemoveItem(item.id)} className="text-gray-400 hover:text-red-500 bg-white shadow-sm border rounded-lg p-1.5 active:scale-95"><Trash2 size={16} /></button></td></tr>))}</tbody>
                            <tfoot className="bg-gray-50 border-t"><tr><td colSpan="2" className="p-4 text-right font-semibold text-gray-700">ยอดรวมทั้งใบ</td><td className="p-4 text-right font-bold text-blue-600 text-lg">฿{totalAmount.toLocaleString()}</td><td></td></tr></tfoot>
                        </table>
                    </div>
                    <div className="p-6 bg-blue-50 border-t border-blue-100">
                        <h3 className="font-bold text-blue-800 mb-4 flex items-center gap-2"><CreditCard size={20}/> ข้อมูลสำหรับรับเงินโอน</h3>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                            <div><label className="block text-xs font-semibold text-blue-700 mb-1">ธนาคาร</label><select className="w-full p-2 border border-blue-200 rounded-lg text-sm" value={bankInfo.bank} onChange={e => setBankInfo({...bankInfo, bank: e.target.value})}>{BANKS.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}</select></div>
                            <div><label className="block text-xs font-semibold text-blue-700 mb-1">ชื่อบัญชี</label><input type="text" className="w-full p-2 border border-blue-200 rounded-lg text-sm" placeholder="ชื่อ-นามสกุลเจ้าของบัญชี" value={bankInfo.accountName} onChange={e => setBankInfo({...bankInfo, accountName: e.target.value})}/></div>
                            <div><label className="block text-xs font-semibold text-blue-700 mb-1">เลขที่บัญชี</label><input type="text" inputMode="numeric" className="w-full p-2 border border-blue-200 rounded-lg text-sm" placeholder="xxx-x-xxxxx-x" value={bankInfo.accountNumber} onChange={e => setBankInfo({...bankInfo, accountNumber: e.target.value})}/></div>
                        </div>
                    </div>
                    
                    {!isAutoApprove && (
                        <div className="p-6 bg-yellow-50 border-t border-yellow-100">
                            <h3 className="font-bold text-yellow-800 mb-3 flex items-center gap-2"><UserCheck size={20}/> เลือกผู้อนุมัติรายการ</h3>
                            <div className="flex gap-4 items-center">
                                <div className="flex-1">
                                    <select className="w-full p-3 border border-yellow-300 rounded-lg text-sm bg-white" value={selectedApproverId} onChange={e => setSelectedApproverId(e.target.value)}>
                                        <option value="">-- กรุณาเลือกผู้อนุมัติ (Manager) --</option>
                                        {approvers.map(ap => (
                                            <option key={ap.id} value={ap.id}>{ap.name} (Manager)</option>
                                        ))}
                                    </select>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="p-4 bg-white border-t"><button onClick={handleSubmitAll} disabled={loading} className="w-full bg-pink-500 text-white py-3 rounded-2xl font-bold hover:bg-pink-600 shadow-md shadow-pink-500/30 disabled:opacity-50 flex items-center justify-center gap-2">{loading ? 'กำลังบันทึกข้อมูล...' : `ยืนยันการเบิกจ่าย (รวม ${totalAmount.toLocaleString()} บาท)`}</button></div>
                 </div>
               )}
            </div>
          );
        };

        const HistoryView = ({ expenses, getBranchName, user }) => {
          const [viewImage, setViewImage] = useState(null);
          const [expandedId, setExpandedId] = useState(null);
          return (
            <>
              <div className="bg-white rounded-xl shadow-sm overflow-hidden flex flex-col h-[calc(100vh-160px)] md:h-[calc(100vh-120px)]">
                <div className="p-5 border-b shrink-0"><h2 className="text-xl font-bold text-gray-800">ประวัติรายการใบเบิก</h2></div>
                <div className="overflow-y-auto overflow-x-auto flex-1 p-0 scrollbar-thin scrollbar-thumb-gray-200">
                  <table className="w-full text-left relative border-collapse min-w-[700px]">
                    <thead className="bg-gray-50 sticky top-0 z-10 shadow-sm"><tr><th className="p-4 text-sm font-semibold text-gray-600">วันที่ / เลขที่ใบเบิก</th><th className="p-4 text-sm font-semibold text-gray-600">รายละเอียด</th><th className="p-4 text-sm font-semibold text-gray-600">ผู้เบิก</th><th className="p-4 text-sm font-semibold text-gray-600 text-right">ยอดรวม</th><th className="p-4 text-sm font-semibold text-gray-600 text-center">สถานะ</th><th className="p-4"></th></tr></thead>
                    <tbody className="divide-y">
                      {expenses.length === 0 ? (<tr><td colSpan="6" className="p-8 text-center text-gray-500">ไม่พบรายการ</td></tr>) : expenses.map(e => (
                        <React.Fragment key={e.id}>
                          <tr className="hover:bg-gray-50 cursor-pointer" onClick={() => setExpandedId(expandedId === e.id ? null : e.id)}>
                            <td className="p-4 text-sm text-gray-600">
                                <div>{e.date ? new Date(e.date.seconds * 1000).toLocaleDateString('th-TH') : '-'}</div>
                                {e.runNumber && <div className="text-xs text-blue-500 font-bold mt-1 bg-blue-50 inline-block px-2 rounded">{e.runNumber}</div>}
                            </td>
                            <td className="p-4 text-sm font-medium text-gray-800">{e.description}{e.items && Array.isArray(e.items) && (<div className="text-xs text-gray-400 font-normal">ประกอบด้วย {e.items.length} รายการย่อย</div>)}</td>
                            <td className="p-4 text-sm text-gray-600">{e.userName}{user.role !== ROLES.EMPLOYEE && (<span className="block text-xs text-gray-400">{getBranchName(e.branchId)}</span>)}</td>
                            <td className="p-4 text-sm font-bold text-gray-800 text-right">฿{parseFloat(e.amount).toLocaleString()}</td>
                            <td className="p-4 text-center"><span className={`inline-block px-3 py-1 rounded-full text-[10px] md:text-xs font-semibold ${STATUS[e.status.toUpperCase()]?.color || 'bg-gray-100'}`}>{STATUS[e.status.toUpperCase()]?.label || e.status}</span></td>
                            <td className="p-4 text-gray-400">{expandedId === e.id ? <ChevronUp size={20}/> : <ChevronDown size={20}/>}</td>
                          </tr>
                          {expandedId === e.id && (
                            <tr className="bg-gray-50 animate-in fade-in">
                              <td colSpan="6" className="p-4 pl-4 md:pl-12">
                                 <div className="bg-white border rounded-lg overflow-hidden shadow-sm">
                                    {e.status === 'rejected' && e.rejectReason && (
                                      <div className="bg-red-50 px-4 py-3 border-b border-red-100 flex items-center gap-2">
                                         <AlertCircle className="text-red-600" size={18} />
                                         <span className="font-bold text-red-800 text-sm">หมายเหตุที่ไม่อนุมัติ:</span>
                                         <span className="text-red-700 text-sm">{e.rejectReason}</span>
                                      </div>
                                    )}
                                    {e.status === 'transferred' && e.transferSlip && (
                                      <div className="bg-green-50 px-4 py-3 border-b border-green-100 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2">
                                         <div className="flex items-center gap-2 text-green-800 font-bold text-sm">
                                            <CheckCircle size={18} /> โอนเงินแล้วเมื่อ {e.transferDate ? new Date(e.transferDate.seconds * 1000).toLocaleString('th-TH') : '-'}
                                         </div>
                                         <button onClick={(ev) => { ev.stopPropagation(); setViewImage(e.transferSlip); }} className="text-green-600 underline text-sm flex items-center gap-1 bg-white px-2 py-1 rounded-md border border-green-200">
                                            <ImageIcon size={16}/> ดูสลิป
                                         </button>
                                      </div>
                                    )}
                                    {e.bankDetails && (
                                      <div className="bg-blue-50 px-4 py-3 border-b border-blue-100 flex items-center justify-between text-sm">
                                        <div className="flex items-start gap-3"><CreditCard className="text-blue-600 mt-0.5" size={18}/><div className="flex flex-col"><span className="font-bold text-blue-800">ข้อมูลรับเงิน:</span><span className="text-gray-700">{e.bankDetails.bankName} • {e.bankDetails.accountNumber}</span><span className="text-gray-700">{e.bankDetails.accountName}</span></div></div>
                                      </div>
                                    )}
                                    <div className="bg-gray-100 px-4 py-2 border-b text-xs font-semibold text-gray-600 flex items-center gap-2"><List size={14}/> รายละเอียดรายการย่อย</div>
                                    {e.items && Array.isArray(e.items) ? (<div className="overflow-x-auto"><table className="w-full text-sm min-w-[500px]"><thead><tr className="border-b text-gray-500 bg-gray-50"><th className="p-3 text-left w-10">#</th><th className="p-3 text-left">รายการ</th><th className="p-3 text-left">หมวดหมู่</th><th className="p-3 text-right">จำนวนเงิน</th><th className="p-3 text-center">หลักฐาน</th></tr></thead><tbody>{e.items.map((item, idx) => (<tr key={idx} className="border-b last:border-0 hover:bg-gray-50"><td className="p-3 text-gray-500">{idx+1}</td><td className="p-3"><div>{item.description}</div><div className="text-xs text-gray-400">{item.date}</div></td><td className="p-3 text-gray-500">{EXPENSE_CATEGORIES.find(c => c.id === item.category)?.name}</td><td className="p-3 text-right font-medium">฿{parseFloat(item.amount).toLocaleString()}</td><td className="p-3 text-center">{item.receipt ? (<button onClick={(ev) => { ev.stopPropagation(); setViewImage(item.receipt); }} className="text-blue-500 hover:text-blue-700 flex items-center justify-center gap-1 text-xs mx-auto"><ImageIcon size={14}/> ดูรูป</button>) : <span className="text-gray-300">-</span>}</td></tr>))}</tbody></table></div>) : (<div className="p-4 text-gray-500 text-center">ไม่มีรายละเอียดรายการย่อย</div>)}
                                 </div>
                              </td>
                            </tr>
                          )}
                        </React.Fragment>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
              {viewImage && (<div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4 backdrop-blur-sm" onClick={() => setViewImage(null)}><div className="bg-white p-2 rounded-lg max-w-3xl max-h-[90vh] overflow-auto relative"><button type="button" onClick={() => setViewImage(null)} className="absolute top-2 right-2 bg-gray-200 rounded-full p-1"><X size={20}/></button><img src={viewImage} alt="Receipt" className="max-w-full h-auto" /></div></div>)}
            </>
          );
        };

        const ApprovalQueue = ({ expenses, user }) => {
          const { showAlert } = useContext(UIContext);
          const [viewImage, setViewImage] = useState(null);
          const [confirmAction, setConfirmAction] = useState({ id: null, type: null }); 
          const [expandedId, setExpandedId] = useState(null);
          const [activeTab, setActiveTab] = useState('pending');
          const [transferSlip, setTransferSlip] = useState(null); 
          const [rejectReason, setRejectReason] = useState('');
          const [updating, setUpdating] = useState(false);
          
          const pendingApprovals = expenses.filter(e => e.status === 'pending' && e.createdBy !== user.uid);
          const pendingTransfers = expenses.filter(e => (e.status === 'waiting_transfer' || e.status === 'approved'));

          const currentList = activeTab === 'pending' ? pendingApprovals : pendingTransfers;

          const handleSlipChange = (e) => {
            const file = e.target.files[0];
            if (file) {
              if (file.size > 800 * 1024) return showAlert("ขนาดรูปภาพต้องไม่เกิน 800KB", 'error');
              const reader = new FileReader();
              reader.onloadend = () => setTransferSlip(reader.result);
              reader.readAsDataURL(file);
            }
          };

          const handleStatusUpdate = async (id, newStatus) => {
            if (newStatus === 'rejected' && !rejectReason.trim()) {
               return showAlert('กรุณาระบุหมายเหตุ/เหตุผลที่ไม่อนุมัติ', 'error');
            }
            
            setUpdating(true);
            try {
               const expense = expenses.find(e => e.id === id);
               const updateData = { status: newStatus, approverId: user.uid, approvedAt: serverTimestamp() };
               
               if (newStatus === 'transferred') {
                 if (transferSlip) updateData.transferSlip = transferSlip;
                 updateData.transferDate = serverTimestamp();
               }
               
               if (newStatus === 'rejected') {
                 updateData.rejectReason = rejectReason.trim();
               }
               
               await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'expenses', id), updateData);
               
               if (expense) {
                 const settingsSnap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'config'));
                 const settings = settingsSnap.data();
                 const userSnap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', expense.userId));
                 const targetUser = userSnap.data();
                 
                 if (settings?.lineToken && targetUser?.lineUserId) {
                    let uploadedImageUrl = null;
                    if (newStatus === 'transferred' && transferSlip && settings.imgbbApiKey) {
                       try {
                          uploadedImageUrl = await uploadImageToImgbb(transferSlip, settings.imgbbApiKey);
                       } catch (uploadErr) {
                          console.error("Imgbb Upload Failed:", uploadErr);
                       }
                    }
                    
                    const expenseForLine = { ...expense, rejectReason: updateData.rejectReason };
                    const message = createExpenseFlexMessage(expenseForLine, newStatus, uploadedImageUrl || transferSlip, user.name, settings.companyName);
                    await sendLineMessage(targetUser.lineUserId, [message], settings.lineToken, settings.scriptUrl, undefined, showAlert);
                 }
               }
               setConfirmAction({ id: null, type: null });
               setTransferSlip(null);
               setRejectReason('');
               showAlert('อัปเดตสถานะสำเร็จ', 'success');
            } catch (err) { console.error(err); showAlert('เกิดข้อผิดพลาด: ' + err.message); }
            setUpdating(false);
          };

          return (
            <div className="space-y-6">
              <div className="flex items-center justify-between"><h2 className="text-xl md:text-2xl font-bold text-gray-800 flex items-center gap-2"><CheckCircle className="text-blue-600" /> รายการรออนุมัติและโอนเงิน</h2></div>
              <div className="flex border-b bg-white rounded-t-xl overflow-hidden">
                <button onClick={() => setActiveTab('pending')} className={`flex-1 py-3 text-center font-bold transition flex items-center justify-center gap-1 md:gap-2 text-sm md:text-base ${activeTab === 'pending' ? 'bg-yellow-50 text-yellow-700 border-b-2 border-yellow-500' : 'text-gray-500 hover:bg-gray-50'}`}><History size={16}/> รอตรวจสอบ ({pendingApprovals.length})</button>
                <button onClick={() => setActiveTab('transfer')} className={`flex-1 py-3 text-center font-bold transition flex items-center justify-center gap-1 md:gap-2 text-sm md:text-base ${activeTab === 'transfer' ? 'bg-blue-50 text-blue-700 border-b-2 border-blue-500' : 'text-gray-500 hover:bg-gray-50'}`}><CreditCard size={16}/> รอโอนเงิน ({pendingTransfers.length})</button>
              </div>
              <div className="space-y-3">
                {currentList.length === 0 ? (<div className="col-span-full bg-white p-12 text-center rounded-b-xl rounded-t-none text-gray-500 border border-dashed">{activeTab === 'pending' ? 'ไม่มีรายการรอตรวจสอบในขณะนี้' : 'ไม่มีรายการรอโอนเงินในขณะนี้'}</div>) : currentList.map(e => (
                  <div key={e.id} className={`bg-white rounded-xl shadow-sm border overflow-hidden transition-all ${expandedId === e.id ? 'ring-2 ring-blue-100' : 'hover:shadow-md'}`}>
                     <div className="p-4 cursor-pointer hover:bg-gray-50" onClick={() => setExpandedId(expandedId === e.id ? null : e.id)}>
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                            <div className="flex-1 w-full pr-8 relative">
                                <div className="font-bold text-gray-800 text-sm md:text-base pr-4">
                                    {e.description} <span className="text-gray-500 font-normal text-xs md:text-sm">({e.items?.length || 0} รายการ)</span>
                                </div>
                                <div className="flex flex-wrap items-center gap-2 md:gap-3 mt-2 text-xs md:text-sm text-gray-600">
                                     <span className="bg-blue-50 text-blue-700 px-2 py-0.5 rounded text-[10px] md:text-xs font-mono font-bold border border-blue-100">{e.runNumber}</span>
                                     <span className="flex items-center gap-1 text-[10px] md:text-xs"><UserCircle size={12}/> {e.userName}</span>
                                     <span className="flex items-center gap-1 text-[10px] md:text-xs text-gray-400"><History size={12}/> {new Date(e.date?.seconds * 1000).toLocaleDateString('th-TH')}</span>
                                </div>
                                <div className="absolute right-0 top-1/2 -translate-y-1/2 text-gray-400 md:hidden">
                                    {expandedId === e.id ? <ChevronUp size={20}/> : <ChevronDown size={20}/>}
                                </div>
                            </div>
                            <div className="flex items-center justify-between w-full md:w-auto md:px-4 text-right">
                                <span className="block font-bold text-blue-600 text-base md:text-lg">฿{parseFloat(e.amount).toLocaleString()}</span>
                                <div className="pl-2 text-gray-400 hidden md:block">
                                     {expandedId === e.id ? <ChevronUp size={20}/> : <ChevronDown size={20}/>}
                                </div>
                            </div>
                        </div>
                     </div>
                     
                     {expandedId === e.id && (
                        <div className="px-4 pb-4 bg-gray-50 border-t pt-4 animate-in fade-in slide-in-from-top-1">
                           {e.bankDetails && (<div className="mb-4 p-3 bg-white rounded-lg border flex flex-col sm:flex-row items-start sm:items-center gap-3 text-sm"><Banknote className="text-green-600 shrink-0" size={20}/><div><div className="font-semibold text-gray-700">{e.bankDetails.bankName}</div><div className="text-gray-500">{e.bankDetails.accountNumber} • {e.bankDetails.accountName}</div></div></div>)}
                           
                           <div className="bg-white rounded-lg border mb-4">
                                {e.items && Array.isArray(e.items) ? (e.items.map((item, idx) => (<div key={idx} className="flex flex-col sm:flex-row justify-between sm:items-center p-3 border-b last:border-0 gap-2 sm:gap-0"><div className="text-sm text-gray-700">{item.description}</div><div className="flex items-center justify-between sm:justify-end gap-2 w-full sm:w-auto"><span className="text-sm font-bold">฿{parseFloat(item.amount).toLocaleString()}</span>{item.receipt && (<button onClick={(ev) => {ev.stopPropagation(); setViewImage(item.receipt);}} className="text-blue-500 hover:bg-blue-50 p-1.5 rounded border"><ImageIcon size={16}/></button>)}</div></div>))) : <div className="p-3 text-gray-500 text-sm">ไม่มีรายการย่อย</div>}
                           </div>

                           <div className="flex gap-2 relative">
                                {confirmAction.id === e.id ? (
                                    <div className="flex-1 bg-white p-3 rounded-lg border border-red-200 shadow-sm animate-in zoom-in-95">
                                        <div className="text-sm font-bold text-gray-800 mb-2 flex items-center gap-2"><AlertCircle size={16} className={confirmAction.type === 'rejected' ? 'text-red-600' : 'text-green-600'}/> {confirmAction.type === 'waiting_transfer' ? 'ยืนยันอนุมัติ?' : confirmAction.type === 'transferred' ? 'ยืนยันการโอนเงิน?' : 'ยืนยันปฏิเสธ?'}</div>
                                        {confirmAction.type === 'transferred' && (
                                           <div className="mb-2">
                                              <label className="block text-[10px] md:text-xs text-gray-500 mb-1">แนบสลิป (รูปภาพจะถูกส่งเข้า LINE พนักงานด้วย) <span className="text-red-500">*</span></label>
                                              <div className="flex flex-col sm:flex-row gap-2 items-start sm:items-center">
                                                  <label className="cursor-pointer bg-gray-100 px-3 py-2 border rounded-lg text-xs flex items-center gap-1 hover:bg-gray-200 w-full sm:w-auto justify-center"><Paperclip size={14}/> เลือกไฟล์รูปสลิป... <input type="file" className="hidden" accept="image/*" onChange={handleSlipChange}/></label>
                                                  {transferSlip && <span className="text-xs text-green-600 font-bold bg-green-50 px-2 py-1 rounded">✓ แนบรูปภาพแล้ว</span>}
                                              </div>
                                           </div>
                                        )}
                                        {confirmAction.type === 'rejected' && (
                                           <div className="mb-3">
                                              <label className="block text-xs text-red-600 mb-1 font-bold">หมายเหตุ / เหตุผลที่ไม่อนุมัติ <span className="text-red-500">*</span></label>
                                              <input type="text" className="w-full p-2 border border-red-200 rounded text-sm focus:ring-1 focus:ring-red-500 outline-none" placeholder="ระบุเหตุผล..." value={rejectReason} onChange={e => setRejectReason(e.target.value)} autoFocus />
                                           </div>
                                        )}
                                        <div className="flex gap-2">
                                            <button disabled={updating || (confirmAction.type === 'transferred' && !transferSlip)} onClick={() => handleStatusUpdate(e.id, confirmAction.type)} className={`flex-1 ${confirmAction.type === 'rejected' ? 'bg-red-600 hover:bg-red-700' : 'bg-green-600 hover:bg-green-700'} text-white text-sm py-2 rounded-lg font-bold disabled:opacity-40`}>
                                                {updating ? 'กำลังบันทึก...' : 'ยืนยัน'}
                                            </button>
                                            <button onClick={() => {setConfirmAction({id:null,type:null}); setTransferSlip(null); setRejectReason('');}} className="flex-1 bg-gray-200 text-gray-700 text-sm py-2 rounded-lg font-bold hover:bg-gray-300">ยกเลิก</button>
                                        </div>
                                    </div>
                                ) : (
                                    activeTab === 'pending' ? (
                                        <>
                                            <button onClick={(ev) => {ev.stopPropagation(); setConfirmAction({ id: e.id, type: 'waiting_transfer' });}} className="flex-1 bg-green-600 text-white py-2.5 rounded-lg font-bold text-sm hover:bg-green-700 shadow-sm">อนุมัติ</button>
                                            <button onClick={(ev) => {ev.stopPropagation(); setConfirmAction({ id: e.id, type: 'rejected' });}} className="flex-1 bg-red-50 text-red-700 py-2.5 rounded-lg font-bold text-sm hover:bg-red-100 border border-red-100">ไม่อนุมัติ</button>
                                        </>
                                    ) : (
                                        <button onClick={(ev) => {ev.stopPropagation(); setConfirmAction({ id: e.id, type: 'transferred' });}} className="flex-1 bg-blue-600 text-white py-2.5 rounded-lg font-bold text-sm hover:bg-blue-700 shadow-sm flex items-center justify-center gap-2"><CheckCircle size={16}/> แจ้งโอนเงินแล้ว</button>
                                    )
                                )}
                           </div>
                        </div>
                     )}
                  </div>
                ))}
              </div>
              {viewImage && (<div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4 backdrop-blur-sm" onClick={() => setViewImage(null)}><div className="bg-white p-2 rounded-lg max-w-3xl max-h-[90vh] overflow-auto relative"><button type="button" onClick={() => setViewImage(null)} className="absolute top-2 right-2 bg-gray-200 rounded-full p-1"><X size={20}/></button><img src={viewImage} alt="Receipt" className="max-w-full h-auto" /></div></div>)}
            </div>
          );
        };

        const ReportView = ({ expenses, branches, companyName }) => {
          const [userMap, setUserMap] = useState({});
          const [users, setUsers] = useState([]);
          const [dateRange, setDateRange] = useState({ start: '', end: '' });
          const [filterCategory, setFilterCategory] = useState('ALL');
          const [filterBranch, setFilterBranch] = useState('ALL');
          const [filterUser, setFilterUser] = useState('ALL');
          const [initialBudget, setInitialBudget] = useState('');

          useEffect(() => {
            const now = new Date();
            const firstDay = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
            const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0).toISOString().split('T')[0];
            setDateRange({ start: firstDay, end: lastDay });

            const unsub = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'users'), (snap) => {
                const map = {};
                const userList = [];
                snap.docs.forEach(d => {
                    const data = d.data();
                    map[d.id] = data.name;
                    userList.push({ id: d.id, ...data });
                });
                setUserMap(map);
                setUsers(userList);
            });
            return () => unsub();
          }, []);

          const reportData = useMemo(() => {
            const flat = [];
            expenses.forEach(e => {
               const expenseDateStr = e.date?.seconds ? new Date(e.date.seconds * 1000).toISOString().split('T')[0] : (e.date instanceof Date ? e.date.toISOString().split('T')[0] : '');
               if (dateRange.start && expenseDateStr < dateRange.start) return;
               if (dateRange.end && expenseDateStr > dateRange.end) return;
               if (filterBranch !== 'ALL' && e.branchId !== filterBranch) return;
               if (filterUser !== 'ALL' && e.userId !== filterUser) return;

               const branchName = e.branchId === 'HEADQUARTER' ? 'สำนักงานใหญ่' : (branches.find(b => b.id === e.branchId)?.name || '-');
